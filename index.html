<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>محاكي كرة القدم 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 20px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 10;
        }
        /* أزرار التحكم للموبايل واللمس */
        .touch-btn {
            position: absolute;
            bottom: 20px;
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid #fff;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            z-index: 10;
        }
        .touch-btn:active { background: rgba(255, 255, 255, 0.7); }
        #btn-pass { right: 20px; bottom: 20px; background: rgba(0, 150, 255, 0.5); }
        #btn-shoot { right: 100px; bottom: 40px; background: rgba(255, 50, 50, 0.5); }
        
        /* D-Pad للحركة */
        #dpad {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            z-index: 10;
        }
        .d-btn {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.3);
            border-radius: 8px;
        }
        #up { top: 0; left: 40px; }
        #down { bottom: 0; left: 40px; }
        #left { top: 40px; left: 0; }
        #right { top: 40px; right: 0; }
    </style>
    <!-- مكتبة الجرافيكس 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="ui">الأحمر <span id="score">0 - 0</span> الأزرق</div>

<!-- أزرار اللمس للموبايل -->
<div id="btn-pass" class="touch-btn">تمرير</div>
<div id="btn-shoot" class="touch-btn">تسديد</div>

<div id="dpad">
    <div id="up" class="d-btn"></div>
    <div id="down" class="d-btn"></div>
    <div id="left" class="d-btn"></div>
    <div id="right" class="d-btn"></div>
</div>

<script>
// --- 1. إعداد المشهد ثلاثي الأبعاد (3D Scene & Camera) ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // لون السماء

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// الإضاءة (Lights)
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(20, 40, 20);
dirLight.castShadow = true;
scene.add(dirLight);

// --- 2. بناء الملعب العشبي والماركات (Field) ---
const pitchGeo = new THREE.PlaneGeometry(60, 40);
const pitchMat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
const pitch = new THREE.Mesh(pitchGeo, pitchMat);
pitch.rotation.x = -Math.PI / 2;
pitch.receiveShadow = true;
scene.add(pitch);

// خطوط الملعب
const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff });
const lineGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-30, 0.05, -20), new THREE.Vector3(30, 0.05, -20),
    new THREE.Vector3(30, 0.05, 20), new THREE.Vector3(-30, 0.05, 20),
    new THREE.Vector3(-30, 0.05, -20), new THREE.Vector3(0, 0.05, -20),
    new THREE.Vector3(0, 0.05, 20)
]);
const lines = new THREE.Line(lineGeo, lineMat);
scene.add(lines);

// --- 3. تصميم الكرة واللاعبين (3D Player & Ball) ---
// الكرة
const ballGeo = new THREE.SphereGeometry(0.6, 16, 16);
const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
const ball = new THREE.Mesh(ballGeo, ballMat);
ball.castShadow = true;
ball.position.set(0, 0.6, 0);
scene.add(ball);
let ballVel = new THREE.Vector3(0, 0, 0);

// دالة دمج مجسم اللاعب (جسم + رأس)
function createPlayer(color) {
    const group = new THREE.Group();
    // الجسم
    const bodyGeo = new THREE.CylinderGeometry(0.5, 0.3, 1.8, 16);
    const bodyMat = new THREE.MeshStandardMaterial({ color: color });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.9;
    body.castShadow = true;
    group.add(body);
    // الرأس
    const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 2.0;
    head.castShadow = true;
    group.add(head);

    return group;
}

const player = createPlayer(0xff3333); // اللاعب الأحمر
player.position.set(-10, 0, 0);
scene.add(player);

const ai = createPlayer(0x3388ff); // المنافس الأزرق
ai.position.set(10, 0, 0);
scene.add(ai);

// --- 4. التحكم والتفاعل (Controls & Physics) ---
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// ربط أزرار الشاشة باللمس
function bindTouch(id, code) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; });
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
    el.addEventListener('mousedown', () => keys[code] = true);
    el.addEventListener('mouseup', () => keys[code] = false);
}
bindTouch('up', 'KeyW');
bindTouch('down', 'KeyS');
bindTouch('left', 'KeyA');
bindTouch('right', 'KeyD');
bindTouch('btn-shoot', 'Space');
bindTouch('btn-pass', 'KeyK');

let scoreP = 0, scoreAI = 0;

// --- 5. حلقة اللعبة والفيزياء (Game Loop) ---
function animate() {
    requestAnimationFrame(animate);

    // حركة اللاعب
    const speed = 0.18;
    let moveZ = 0, moveX = 0;

    if (keys['KeyW'] || keys['ArrowUp']) moveZ -= speed;
    if (keys['KeyS'] || keys['ArrowDown']) moveZ += speed;
    if (keys['KeyA'] || keys['ArrowLeft']) moveX -= speed;
    if (keys['KeyD'] || keys['ArrowRight']) moveX += speed;

    player.position.x += moveX;
    player.position.z += moveZ;

    // توجيه وجه اللاعب باتجاه الحركة
    if (moveX !== 0 || moveZ !== 0) {
        player.rotation.y = Math.atan2(moveX, moveZ);
    }

    // حركة الذكاء الاصطناعي البسيطة (AI)
    const aiDir = new THREE.Vector3().subVectors(ball.position, ai.position);
    aiDir.y = 0;
    if (aiDir.length() > 1.2) {
        aiDir.normalize().multiplyScalar(0.1);
        ai.position.add(aiDir);
        ai.rotation.y = Math.atan2(aiDir.x, aiDir.z);
    }

    // فيزياء الكرة واحتكاكها
    ball.position.add(ballVel);
    ballVel.multiplyScalar(0.95); // احتكاك العشب

    // اصطدام اللاعب بالكرة
    const distP = player.position.distanceTo(ball.position);
    if (distP < 1.3) {
        const pDir = new THREE.Vector3().subVectors(ball.position, player.position).normalize();
        ballVel.add(pDir.multiplyScalar(0.08));
    }

    // زر التسديد (Space)
    if (keys['Space'] && distP < 2.0) {
        const shootDir = new THREE.Vector3(1, 0.2, 0).normalize();
        ballVel.copy(shootDir.multiplyScalar(0.8)); // تسديدة قوية
        keys['Space'] = false;
    }

    // الكاميرا تتتبع اللاعب والكرة زي فيفا (Isometric Camera)
    camera.position.set(player.position.x, 18, player.position.z + 22);
    camera.lookAt(player.position.x, 0, player.position.z);

    renderer.render(scene, camera);
}

animate();

// إعادة ضبط الشاشة عند التدوير
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
