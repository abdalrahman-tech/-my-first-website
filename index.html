<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي المراحل والأسئلة 🏆</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        /* 1. إضافة خلفية صورة مع ألوان مدرجة شيك جداً */
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                        url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 2. تصميم كارت اللعبة الشفاف والمضيء */
        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .category-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 { font-size: 2rem; margin-bottom: 15px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        p { font-size: 1.1rem; margin-bottom: 25px; color: #e2e8f0; }

        .btn {
            background: linear-gradient(45deg, #ff7b00, #ffae00);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(255, 123, 0, 0.4);
        }

        .category-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 14px;
            margin: 8px 0;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: 0.2s;
        }

        .hidden { display: none; }
        .progress-bar { background: rgba(255, 255, 255, 0.2); height: 10px; width: 100%; margin-bottom: 20px; border-radius: 5px; }
        .progress { background: #00ff88; height: 100%; width: 0%; transition: 0.4s; }
    </style>
</head>
<body>

    <div class="card">
        <!-- الشاشة الرئيسية -->
        <div id="home-screen">
            <h1>🏆 تحدي المعرفة</h1>
            <p>اختر المجال واختبر معلوماتك العامة الآن!</p>
            <button class="btn" onclick="showCategories()">ابدأ اللعب 🎮</button>
        </div>

        <!-- شاشة اختيار القسم -->
        <div id="category-screen" class="hidden">
            <h2>اختر نوع التحدي 🎯</h2>
            <br>
            <button class="btn category-btn" onclick="startGame('football')">كرة القدم ⚽</button>
            <button class="btn category-btn" onclick="startGame('cooking')">الطبخ 🍳</button>
            <button class="btn category-btn" onclick="startGame('general')">أسئلة عامة 🧠</button>
        </div>

        <!-- شاشة اللعب -->
        <div id="quiz-screen" class="hidden">
            <img id="q-image" class="category-img" src="" alt="صورة السؤال">
            <div class="progress-bar"><div id="progress" class="progress"></div></div>
            <h3 id="question-text" style="margin-bottom: 15px;"></h3>
            <div id="options-container"></div>
        </div>

        <!-- شاشة الفوز -->
        <div id="win-screen" class="hidden">
            <h1>🏁 مبروك الفوز!</h1>
            <p>أنت بطل ونجحت في تخطي التحدي بنجاح! 🎉</p>
            <button class="btn" onclick="location.reload()">العب من جديد 🔄</button>
        </div>
    </div>

    <script>
        const questionsData = {
            football: {
                img: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=800&auto=format&fit=crop",
                questions: [
                    { q: "كم عدد لاعبي الفريق داخل الملعب؟", o: ["9 لاعبين", "11 لاعب", "12 لاعب"], c: 1 },
                    { q: "ما هي الدولة الفائزة بكأس العالم 2022؟", o: ["فرنسا", "الأرجنتين", "البرازيل"], c: 1 }
                ]
            },
            cooking: {
                img: "https://images.unsplash.com/photo-1556910103-1c02745aae4d?q=80&w=800&auto=format&fit=crop",
                questions: [
                    { q: "ما المكون الأساسي للخبز؟", o: ["الأرز", "الدقيق", "السكر"], c: 1 },
                    { q: "ما هو التابل الأغلى ثمناً في العالم؟", o: ["الزعفران", "الفلفل الأسود", "الكمون"], c: 0 }
                ]
            },
            general: {
                img: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=800&auto=format&fit=crop",
                questions: [
                    { q: "ما هو أكبر كوكب في المجموعة الشمسية؟", o: ["الأرض", "المشتري", "المريخ"], c: 1 },
                    { q: "كم عدد قارات العالم؟", o: ["5", "7", "6"], c: 1 }
                ]
            }
        };

        let currentCat, currentLevel = 0;

        function showCategories() {
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('category-screen').classList.remove('hidden');
        }

        function startGame(catKey) {
            currentCat = questionsData[catKey];
            currentLevel = 0;
            document.getElementById('category-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('q-image').src = currentCat.img;
            loadQ();
        }

        function loadQ() {
            const qData = currentCat.questions[currentLevel];
            document.getElementById('question-text').innerText = qData.q;
            const cont = document.getElementById('options-container');
            cont.innerHTML = '';
            
            qData.o.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = 'option-btn';
                b.innerText = opt;
                b.onclick = () => {
                    if (i === qData.c) {
                        currentLevel++;
                        if (currentLevel < currentCat.questions.length) {
                            loadQ();
                        } else {
                            document.getElementById('quiz-screen').classList.add('hidden');
                            document.getElementById('win-screen').classList.remove('hidden');
                        }
                    } else {
                        alert("إجابة خاطئة! ❌ حاول مرة أخرى.");
                    }
                };
                cont.appendChild(b);
            });

            document.getElementById('progress').style.width = ((currentLevel) / currentCat.questions.length) * 100 + "%";
        }
    </script>
</body>
</html>
