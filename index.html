<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي كرة القدم - المرحلة الأولى</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #gameHUD {
            position: absolute;
            top: 15px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 25px;
            border-radius: 8px;
            border: 1px solid #444;
            text-align: center;
            font-size: 18px;
            pointer-events: none;
        }
        canvas {
            display: block;
            background-color: #1e601e;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<div id="gameHUD">
    <div><b>المرحلة 1:</b> محرك فيزياء الكرة والملعب والكاميرا</div>
    <small style="color: #aaa;">انقر واصلاد الماوس على الكرة لدفعها وتجربة الفيزياء | R لإعادة الكرة للمنتصف</small>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// ==========================================
// 1. إعداد الشاشة والـ Canvas
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ==========================================
// 2. أبعاد وقواعد الملعب (Pitch Specs)
// ==========================================
const PITCH = {
    width: 1400,
    height: 900,
    border: 50,
    goalWidth: 160,
    goalDepth: 40
};

// ==========================================
// 3. كائن الكرة والفيزياء (Ball Engine)
// ==========================================
class Ball {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 10;
        this.vx = 0; // السرعة المتجهة X
        this.vy = 0; // السرعة المتجهة Y
        this.friction = 0.982; // معامل احتكاك الأرضية
        this.bounce = 0.75; // معامل الارتداد من القوائم والجدران
    }

    update() {
        // تطبيق الاحتكاك التدريجي
        this.vx *= this.friction;
        this.vy *= this.friction;

        // إيقاف الحركة الدقيقة جداً لمنع الـ jittering
        if (Math.abs(this.vx) < 0.01) this.vx = 0;
        if (Math.abs(this.vy) < 0.01) this.vy = 0;

        // تحديث الإحداثيات
        this.x += this.vx;
        this.y += this.vy;

        // معالجة اصطدامات الحدود والمرمى
        this.handleCollisions();
    }

    handleCollisions() {
        const topY = PITCH.border;
        const bottomY = PITCH.border + PITCH.height;
        const leftX = PITCH.border;
        const rightX = PITCH.border + PITCH.width;
        const goalTop = PITCH.border + (PITCH.height / 2) - (PITCH.goalWidth / 2);
        const goalBottom = PITCH.border + (PITCH.height / 2) + (PITCH.goalWidth / 2);

        // اصطدام مع التماس الأعلى والأسفل
        if (this.y - this.radius < topY) {
            this.y = topY + this.radius;
            this.vy *= -this.bounce;
        }
        if (this.y + this.radius > bottomY) {
            this.y = bottomY - this.radius;
            this.vy *= -this.bounce;
        }

        // اصطدام الخط الخلفي الأيسر (خارج المرمى)
        if (this.x - this.radius < leftX) {
            if (this.y > goalTop && this.y < goalBottom) {
                // داخل شباك المرمى الأيسر
                if (this.x - this.radius < leftX - PITCH.goalDepth) {
                    this.x = leftX - PITCH.goalDepth + this.radius;
                    this.vx *= -this.bounce;
                }
            } else {
                // اصطدام الجدار الخلفي
                this.x = leftX + this.radius;
                this.vx *= -this.bounce;
            }
        }

        // اصطدام الخط الخلفي الأيمن (خارج المرمى)
        if (this.x + this.radius > rightX) {
            if (this.y > goalTop && this.y < goalBottom) {
                // داخل شباك المرمى الأيمن
                if (this.x + this.radius > rightX + PITCH.goalDepth) {
                    this.x = rightX + PITCH.goalDepth - this.radius;
                    this.vx *= -this.bounce;
                }
            } else {
                // اصطدام الجدار الخلفي
                this.x = rightX - this.radius;
                this.vx *= -this.bounce;
            }
        }

        // فيزياء القائمين والعارضة (Posts Collisions)
        this.checkPostCollision(leftX, goalTop);
        this.checkPostCollision(leftX, goalBottom);
        this.checkPostCollision(rightX, goalTop);
        this.checkPostCollision(rightX, goalBottom);
    }

    checkPostCollision(postX, postY) {
        const postRadius = 5;
        const dx = this.x - postX;
        const dy = this.y - postY;
        const distance = Math.hypot(dx, dy);

        if (distance < this.radius + postRadius) {
            // زاوية الانعكاس الفيزيائية من القائم
            const angle = Math.atan2(dy, dx);
            const speed = Math.hypot(this.vx, this.vy) * this.bounce;

            this.vx = Math.cos(angle) * (speed + 1);
            this.vy = Math.sin(angle) * (speed + 1);

            this.x = postX + Math.cos(angle) * (this.radius + postRadius);
            this.y = postY + Math.sin(angle) * (this.radius + postRadius);
        }
    }

    draw(ctx) {
        // ظل الكرة
        ctx.beginPath();
        ctx.ellipse(this.x + 3, this.y + 5, this.radius, this.radius * 0.6, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
        ctx.fill();

        // جسم الكرة
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "#000000";
        ctx.stroke();
    }
}

// ==========================================
// 4. نظام الكاميرا السلسة (Smooth Lerp Camera)
// ==========================================
class Camera {
    constructor() {
        this.x = 0;
        this.y = 0;
        this.lerpSpeed = 0.08; // سرعة تتبع الكاميرا
    }

    follow(target) {
        // حساب النقطة المستهدفة لمنتصف الشاشة
        const targetX = target.x - canvas.width / 2;
        const targetY = target.y - canvas.height / 2;

        // تطبيق الاستيفاء الخطي (Lerp) لحركة كاميرا احترافية وسلسة
        this.x += (targetX - this.x) * this.lerpSpeed;
        this.y += (targetY - this.y) * this.lerpSpeed;
    }
}

// ==========================================
// 5. بناء العناصر وتجهيز البيئة
// ==========================================
const ball = new Ball(PITCH.border + PITCH.width / 2, PITCH.border + PITCH.height / 2);
const camera = new Camera();

// ==========================================
// 6. رسم الملعب (Pitch Rendering)
// ==========================================
function drawPitch() {
    const startX = PITCH.border;
    const startY = PITCH.border;
    const goalTop = startY + (PITCH.height / 2) - (PITCH.goalWidth / 2);

    // العشب المقلم (Stripes)
    const stripeWidth = 80;
    for (let x = startX; x < startX + PITCH.width; x += stripeWidth) {
        ctx.fillStyle = ((x / stripeWidth) % 2 === 0) ? '#247324' : '#1e601e';
        ctx.fillRect(x, startY, Math.min(stripeWidth, startX + PITCH.width - x), PITCH.height);
    }

    // خطوط التماس
    ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
    ctx.lineWidth = 4;
    ctx.strokeRect(startX, startY, PITCH.width, PITCH.height);

    // خط المنتصف والدائرة
    ctx.beginPath();
    ctx.moveTo(startX + PITCH.width / 2, startY);
    ctx.lineTo(startX + PITCH.width / 2, startY + PITCH.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(startX + PITCH.width / 2, startY + PITCH.height / 2, 90, 0, Math.PI * 2);
    ctx.stroke();

    // منطقة الجزاء اليسرى واليمنى
    ctx.strokeRect(startX, startY + PITCH.height / 2 - 180, 220, 360);
    ctx.strokeRect(startX + PITCH.width - 220, startY + PITCH.height / 2 - 180, 220, 360);

    // شبكة وحلقات المرمى (الأيسر والأيمن)
    ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
    ctx.fillRect(startX - PITCH.goalDepth, goalTop, PITCH.goalDepth, PITCH.goalWidth);
    ctx.strokeRect(startX - PITCH.goalDepth, goalTop, PITCH.goalDepth, PITCH.goalWidth);

    ctx.fillRect(startX + PITCH.width, goalTop, PITCH.goalDepth, PITCH.goalWidth);
    ctx.strokeRect(startX + PITCH.width, goalTop, PITCH.goalDepth, PITCH.goalWidth);

    // رسم القوائم (Post Circles)
    ctx.fillStyle = "#ffffff";
    const posts = [
        {x: startX, y: goalTop},
        {x: startX, y: goalTop + PITCH.goalWidth},
        {x: startX + PITCH.width, y: goalTop},
        {x: startX + PITCH.width, y: goalTop + PITCH.goalWidth}
    ];
    posts.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
    });
}

// ==========================================
// 7. التحكم والتفاعل المباشر للتجربة
// ==========================================
let isDragging = false;
let dragStartX = 0, dragStartY = 0;

window.addEventListener('mousedown', (e) => {
    // تحويل إحداثيات الماوس إلى إحداثيات العالم عبر الكاميرا
    const worldMouseX = e.clientX + camera.x;
    const worldMouseY = e.clientY + camera.y;

    const dist = Math.hypot(worldMouseX - ball.x, worldMouseY - ball.y);
    if (dist < ball.radius * 3) {
        isDragging = true;
        dragStartX = worldMouseX;
        dragStartY = worldMouseY;
    }
});

window.addEventListener('mouseup', (e) => {
    if (isDragging) {
        const worldMouseX = e.clientX + camera.x;
        const worldMouseY = e.clientY + camera.y;

        // دفع الكرة بناءً على سحب الماوس
        ball.vx = (dragStartX - worldMouseX) * 0.2;
        ball.vy = (dragStartY - worldMouseY) * 0.2;
        isDragging = false;
    }
});

window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R' || e.key === 'ق') {
        ball.x = PITCH.border + PITCH.width / 2;
        ball.y = PITCH.border + PITCH.height / 2;
        ball.vx = 0;
        ball.vy = 0;
    }
});

// ==========================================
// 8. حلقة اللعبة الرئيسية (Game Loop)
// ==========================================
function gameLoop() {
    // 1. تحديث الفيزياء والكاميرا
    ball.update();
    camera.follow(ball);

    // 2. تنظيف الشاشة
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 3. تطبيق مصفوفة تحويل الكاميرا
    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // 4. رسم العالم (الملعب ثم الكرة)
    drawPitch();
    ball.draw(ctx);

    ctx.restore();

    requestAnimationFrame(gameLoop);
}

// تشغيل المحرك
gameLoop();
</script>
</body>
</html>
