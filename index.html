<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Game Hub 🎮</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
      color: #333;
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 25px;
      padding: 25px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
    h1 { color: #2d3436; margin-bottom: 20px; font-size: 24px; }
    .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
    .card {
      background: #ffffff;
      border: 2px solid #e0e0e0;
      border-radius: 18px;
      padding: 15px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: all 0.2s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .card:hover { transform: translateY(-3px); border-color: #6c5ce7; background: #f8f9fa; }
    .card .icon { font-size: 32px; display: block; margin-bottom: 5px; }
    .btn {
      background: #6c5ce7;
      border: none;
      padding: 14px;
      margin: 8px 0;
      border-radius: 14px;
      color: white;
      width: 100%;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
      transition: 0.2s;
    }
    .btn-opt { background: #00cec9; color: #fff; }
    .btn-opt:hover { background: #00b894; }
    .btn-nav { background: #636e72; margin-top: 15px; }
    .stats-bar {
      background: #ffeaa7;
      color: #d63031;
      padding: 12px;
      border-radius: 15px;
      margin-bottom: 15px;
      font-weight: bold;
      font-size: 15px;
      display: flex;
      justify-content: space-around;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
    }
    .hidden { display: none; }
    #msg-box { height: 30px; font-size: 18px; font-weight: bold; margin: 10px 0; }
  </style>
</head>
<body>

<div class="container">
  <!-- الشاشة الرئيسية -->
  <div id="home">
    <h1>🎮 عالم الألعاب والمسابقات</h1>
    <div class="category-grid">
      <div class="card" onclick="startQuiz('cooking')">
        <span class="icon">🍳</span> الطبخ والأكلات
      </div>
      <div class="card" onclick="startQuiz('sports')">
        <span class="icon">⚽</span> كرة القدم والرياضة
      </div>
      <div class="card" onclick="startQuiz('general')">
        <span class="icon">🌍</span> معلومات عامة
      </div>
      <div class="card" onclick="startStory()">
        <span class="icon">📖</span> مغامرات وتخمين
      </div>
    </div>
  </div>

  <!-- واجهة اللعب -->
  <div id="game-ui" class="hidden">
    <div class="stats-bar">
      <span>🔑 المفاتيح: <span id="keys-count">0</span></span>
      <span>📊 التقدم: <span id="q-progress">0</span>/20</span>
    </div>
    <div id="msg-box"></div>
    <div id="content"></div>
    <button class="btn btn-nav" onclick="goHome()">🏠 القائمة الرئيسية</button>
  </div>
</div>

<script>
  // بيانات الأقسام والأسئلة الأساسية
  const quizCategories = {
    cooking: [
      { q: "ما هو المكون الأساسي في أكلة المنسف؟", o: ["الجميد واللحم", "السمك", "الدجاج والمشروم"], a: 0 },
      { q: "ما هي الصلصة الأساسية للبيتزا الإيطالية؟", o: ["صلصة الطماطم", "المايونيز", "الخردل"], a: 0 },
      { q: "أي من هذه الأطباق يعتبر طبقاً مصرياً شهيراً؟", o: ["الكشري", "الكبسة", "الكسكسي"], a: 0 }
    ],
    sports: [
      { q: "كم عدد لاعبي فريق كرة القدم داخل الملعب؟", o: ["11 لاعب", "9 لاعبين", "12 لاعب"], a: 0 },
      { q: "كم مدة الشوط الواحد في مباراة كرة القدم؟", o: ["45 دقيقة", "30 دقيقة", "60 دقيقة"], a: 0 },
      { q: "ما هي البطولة الأكثر شهرة للأندية في أوروبا؟", o: ["دوري أبطال أوروبا", "كأس الاتحاد", "كأس آسيا"], a: 0 }
    ],
    general: [
      { q: "ما هي عاصمة جمهورية مصر العربية؟", o: ["القاهرة", "الإسكندرية", "أسوان"], a: 0 },
      { q: "ما هو أكبر كوكب في المجموعة الشمسية؟", o: ["المشتري", "المريخ", "الأرض"], a: 0 },
      { q: "ما هو أسرع كائن حي على الأرض؟", o: ["الفهد", "الأسد", "الغزال"], a: 0 }
    ]
  };

  // استرجاع البيانات المحفوظة
  let keys = parseInt(localStorage.getItem('app_keys')) || 0;
  let totalAnswered = parseInt(localStorage.getItem('app_answered')) || 0;
  let currentCategory = 'general';
  let categoryIndex = 0;

  // إعداد الأصوات المريحة للسمع
  function playNiceSound(isCorrect) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (isCorrect) {
      // نغمة مبهجة ومريحة (C5 -> E5)
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime); 
      osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    } else {
      // صوت منخفض ناعم غير مزعج
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    }
  }

  function updateHeader() {
    document.getElementById('keys-count').innerText = keys;
    document.getElementById('q-progress').innerText = totalAnswered % 20;
  }

  function saveProgress() {
    localStorage.setItem('app_keys', keys);
    localStorage.setItem('app_answered', totalAnswered);
  }

  function startQuiz(cat) {
    currentCategory = cat;
    categoryIndex = 0;
    document.getElementById('home').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    updateHeader();
    loadQuestion();
  }

  function goHome() {
    document.getElementById('home').classList.remove('hidden');
    document.getElementById('game-ui').classList.add('hidden');
  }

  // محرك مولد لـ 1000+ سؤال
  function getCurrentQuestion() {
    const list = quizCategories[currentCategory] || quizCategories.general;
    if (categoryIndex < list.length) {
      return list[categoryIndex];
    } else {
      // توليد أسئلة ذكاء وحساب غير محدودة تلقائياً
      const n1 = Math.floor(Math.random() * 50) + 1;
      const n2 = Math.floor(Math.random() * 50) + 1;
      const correct = n1 + n2;
      return {
        q: `ما هو حاصل جمع الرقمين: ${n1} + ${n2} ؟`,
        o: [correct.toString(), (correct + 3).toString(), (correct - 2).toString()].sort(() => Math.random() - 0.5),
        a: null,
        correctVal: correct.toString()
      };
    }
  }

  function loadQuestion() {
    const qData = getCurrentQuestion();
    const cont = document.getElementById('content');
    document.getElementById('msg-box').innerText = "";
    
    cont.innerHTML = `<h3 style="color:#2d3436; margin-bottom:20px;">${qData.q}</h3>`;
    
    qData.o.forEach((opt) => {
      const b = document.createElement('button');
      b.className = 'btn btn-opt';
      b.innerText = opt;
      b.onclick = () => {
        const allBtns = document.querySelectorAll('.btn-opt');
        allBtns.forEach(btn => btn.disabled = true);

        const isCorrect = (qData.a !== null) ? (opt === qData.o[qData.a]) : (opt === qData.correctVal);

        if (isCorrect) {
          playNiceSound(true);
          document.getElementById('msg-box').innerText = "✨ إجابة صحيحة وممتازة!";
          document.getElementById('msg-box').style.color = "#00b894";
          b.style.background = "#00b894";
          
          totalAnswered++;
          // إضافة مفتاح كل 20 سؤال
          if (totalAnswered > 0 && totalAnswered % 20 === 0) {
            keys++;
            document.getElementById('msg-box').innerText = "🎉 رائع! أكملت 20 سؤالاً وحصلت على 🔑 مفتاح جديد!";
          }
        } else {
          playNiceSound(false);
          document.getElementById('msg-box').innerText = "❌ إجابة خاطئة، حاول في السؤال القادم!";
          document.getElementById('msg-box').style.color = "#d63031";
          b.style.background = "#d63031";
        }

        categoryIndex++;
        saveProgress();
        updateHeader();
        setTimeout(loadQuestion, 1600);
      };
      cont.appendChild(b);
    });
  }

  function startStory() {
    document.getElementById('home').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    document.getElementById('msg-box').innerText = "";
    
    const cont = document.getElementById('content');
    cont.innerHTML = `
      <h3>📖 رحلة البحث عن الكنز المفقود</h3>
      <p style="color:#636e72;">أنت الآن أمام قصر قديم، لديك خياران للدخول:</p>
      <button class="btn btn-opt" onclick="playNiceSound(true); alert('دخلت من الباب الأمامي ووجدت أول خريطة!')">🚪 الباب الأمامي</button>
      <button class="btn btn-opt" onclick="playNiceSound(false); alert('الحديقة الخلفية مليئة بالمصائد، عد للمقدمة!')">🌳 الحديقة الخلفية</button>
    `;
  }
</script>
</body>
</html>
