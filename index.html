<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Game Hub</title>
  <style>
    body { background: #0f0c29; color: #fff; margin: 0; padding: 10px; font-family: sans-serif; }
    .container { max-width: 500px; margin: auto; background: #1a1a2e; padding: 20px; border-radius: 20px; text-align: center; }
    .btn { background: #4e44ce; border: none; padding: 15px; margin: 5px; border-radius: 10px; color: white; width: 90%; cursor: pointer; font-size: 16px; }
    .btn:active { background: #3a32a0; }
    #msg-box { height: 50px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    .app-card { background: #262645; padding: 20px; border-radius: 15px; margin-bottom: 10px; cursor: pointer; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container" id="app">
  <!-- الشاشة الرئيسية -->
  <div id="home">
    <h1>أهلاً بك في عالم الألعاب 🎮</h1>
    <div class="app-card" onclick="openGame('quiz')">تحدي الأسئلة الذكية</div>
    <div class="app-card" onclick="openGame('story')">رحلة المغامرة (قصص)</div>
  </div>

  <!-- واجهة اللعبة -->
  <div id="game-ui" class="hidden">
    <button class="btn" style="background: #333; width: auto;" onclick="goHome()">🏠 رجوع للقائمة</button>
    <div id="msg-box"></div>
    <div id="content"></div>
  </div>
</div>

<script>
  // 1. بيانات الأسئلة
  const quizData = [
    { q: "ما هي عاصمة اليابان؟", o: ["طوكيو", "سيدني", "بكين"], a: 0 },
    { q: "ما هو أسرع حيوان في العالم؟", o: ["الفهد", "الأسد", "الغزال"], a: 0 },
    { q: "كم عدد كواكب المجموعة الشمسية؟", o: ["7", "8", "9"], a: 1 }
  ];

  // 2. بيانات القصص (توسع فيها زي ما تحب)
  const storyData = {
    start: { t: "أنت بطل أسطوري، تستيقظ في قلعة مهجورة. ماذا تفعل؟", o: [{t: "الخروج للغابة", n: "forest"}, {t: "البحث في القلعة", n: "castle"}] },
    forest: { t: "الغابة مخيفة، سمعت صوت ذئب! اهرب أم واجه؟", o: [{t: "الهروب", n: "start"}, {t: "المواجهة", n: "win"}] },
    castle: { t: "وجدت كنزاً قديماً! هل تأخذه؟", o: [{t: "نعم", n: "win"}, {t: "لا", n: "start"}] },
    win: { t: "🎉 مبروك! لقد فزت بالمغامرة.", o: [{t: "إعادة اللعب", n: "start"}] }
  };

  let currentGame = '';

  function openGame(type) {
    currentGame = type;
    document.getElementById('home').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    if(type === 'quiz') nextQuiz();
    else renderStory('start');
  }

  function goHome() {
    document.getElementById('home').classList.remove('hidden');
    document.getElementById('game-ui').classList.add('hidden');
  }

  // منطق لعبة الأسئلة
  function nextQuiz() {
    const q = quizData[Math.floor(Math.random() * quizData.length)];
    const cont = document.getElementById('content');
    cont.innerHTML = `<h3>${q.q}</h3>`;
    q.o.forEach((opt, idx) => {
      const b = document.createElement('button');
      b.className = 'btn';
      b.innerText = opt;
      b.onclick = () => {
        const btns = document.querySelectorAll('.btn');
        btns.forEach(btn => btn.disabled = true);
        
        if(idx === q.a) {
          document.getElementById('msg-box').innerText = "✅ صحيح!";
          b.style.background = "#27ae60";
        } else {
          document.getElementById('msg-box').innerText = "❌ خطأ!";
          b.style.background = "#c0392b";
        }
        setTimeout(nextQuiz, 1000);
      };
      cont.appendChild(b);
    });
  }

  // منطق لعبة القصص
  function renderStory(id) {
    const s = storyData[id];
    const cont = document.getElementById('content');
    cont.innerHTML = `<h3>${s.t}</h3>`;
    s.o.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'btn';
      b.innerText = opt.t;
      b.onclick = () => renderStory(opt.n);
      cont.appendChild(b);
    });
  }
</script>
</body>
</html>
