<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المحقق - قضية مقتل القصر</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, 'Segoe UI', Tahoma, monospace; user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #0b0d12; color: #e2e8f0; overflow: hidden; display: flex; flex-direction: column; }

        /* شريط العنوان علوي */
        #top-bar {
            background: #111827;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f59e0b;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .title-badge { font-weight: bold; color: #f59e0b; font-size: 14px; }
        .energy-box { background: #1f2937; padding: 4px 10px; border-radius: 6px; border: 1px solid #374151; font-size: 12px; }

        /* الشاشة الرئيسية للعبة */
        #game-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 650px;
            margin: 0 auto;
            width: 100%;
        }

        /* كروت التفاصيل والمعاينة */
        .case-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .card-header { font-size: 14px; font-weight: bold; color: #38bdf8; margin-bottom: 8px; border-bottom: 1px solid #1f2937; padding-bottom: 5px; }
        .card-body { font-size: 12px; line-height: 1.6; color: #cbd5e1; }

        /* قائمة التفاعل (الأدلة، المشتبه فيهم) */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action-btn {
            background: #1f2937;
            border: 1px solid #374151;
            color: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .action-btn:hover { background: #374151; border-color: #f59e0b; }

        /* شريط التنقل السفلي */
        #bottom-nav {
            background: #111827;
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-top: 2px solid #1f2937;
        }
        .nav-btn {
            background: #1f2937;
            color: #9ca3af;
            border: 1px solid #374151;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-btn.active, .nav-btn:hover { background: #f59e0b; color: #000; border-color: #f59e0b; }

        /* قائمة الحوار والنصوص */
        .dialogue-box {
            background: #000;
            border: 1px solid #f59e0b;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 12px;
            color: #22c55e;
        }

        /* نافذة الاتهام النهائي */
        .suspect-select {
            width: 100%;
            padding: 10px;
            background: #1f2937;
            color: white;
            border: 1px solid #374151;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 12px;
        }
        .accuse-btn {
            width: 100%;
            background: #dc2626;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            font-size: 13px;
        }
        .accuse-btn:hover { background: #b91c1c; }
    </style>
</head>
<body>

    <!-- شريط العلوي -->
    <div id="top-bar">
        <div class="title-badge">🕵️ ملف القضية #104</div>
        <div class="energy-box">⏳ نقاط التحقيق: <span id="points" style="color:#f59e0b">5</span></div>
    </div>

    <!-- محتوى اللعبة -->
    <div id="game-container">
        
        <!-- تفاصيل القصة -->
        <div class="case-card">
            <div class="card-header">📂 تفاصيل الحادثة</div>
            <div class="card-body">
                تم العثور على رجل الأعمال الشهير **مراد الألفي** مقتولاً داخل مكتبه الخاص في القصر عند الساعة 9:00 مساءً. جثة الضحية كانت مطعونة بدبوس زينة فضي حاد، وتوجد كاسات عصير وساعة حائط مكسورة تشير للساعة 8:15.
            </div>
        </div>

        <!-- المنطقة الديناميكية التي تتغير حسب التبويب -->
        <div id="dynamic-view"></div>

    </div>

    <!-- شريط التنقل -->
    <div id="bottom-nav">
        <button class="nav-btn active" id="btn-scene" onclick="switchView('scene')">🔍 مسرح الجريمة</button>
        <button class="nav-btn" id="btn-suspects" onclick="switchView('suspects')">👥 المشتبه فيهم</button>
        <button class="nav-btn" id="btn-clues" onclick="switchView('clues')">📁 دفتر الأدلة</button>
        <button class="nav-btn" id="btn-accuse" onclick="switchView('accuse')">⚖️ الاتهام والقبض</button>
    </div>

    <script>
        let points = 5;
        let cluesFound = [];
        let currentView = 'scene';

        const cluesData = {
            desk: { name: "رسالة تهديد", text: "تم العثور في المكتوب على خط يد يطالب مراد بدفع ديون قديمة قبل نهاية الأسبوع." },
            clock: { name: "ساعة الحائط المكسورة", text: "الساعة توقفت عند 8:15 مساءً إثر مشاجرة وتكسير في المكتب." },
            glass: { name: "كأس عصير محتوي على منوم", text: "الكأس الثاني يحتوي على بقايا مادة مهدئة ومسكنة." },
            safe: { name: "الخزنة المفتوحة", text: "الخزنة مفتوحة ومسروق منها الأوراق المالية فقط، بينما المجوهرات سليمة." }
        };

        const suspectsData = {
            s1: { name: "خالد (الشريك التجاري)", dialogue: "كنت في المنزل عند الساعة 8:00 مساءً! مراد كان مدين لي بالمال ولكني لم أقتله." },
            s2: { name: "مريم (الزوجة)", dialogue: "كنت في الحديقة أتناول العصير معه عند 7:30، ثم صعدت لغرفتي ولم أسمع شيئاً." },
            s3: { name: "سعيد (الخادم الخاص)", dialogue: "حضرت له العصير بناءً على طلب الزوجة مريم، وخرجت لمطبخ القصر فوراً." }
        };

        function updateUI() {
            document.getElementById('points').innerText = points;
        }

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${view}`).classList.add('active');

            const container = document.getElementById('dynamic-view');

            if (view === 'scene') {
                container.innerHTML = `
                    <div class="case-card">
                        <div class="card-header">🔍 معاينة مسرح الجريمة (اختر مكاناً لتفتيشه)</div>
                        <div class="action-grid" style="margin-top: 10px;">
                            <button class="action-btn" onclick="inspect('desk')">📑 تفتيش المكتب</button>
                            <button class="action-btn" onclick="inspect('clock')">🕰️ معاينة الساعة</button>
                            <button class="action-btn" onclick="inspect('glass')">🍷 فحص الكؤوس</button>
                            <button class="action-btn" onclick="inspect('safe')">🔓 فتح الخزنة</button>
                        </div>
                    </div>
                    <div id="dialogue-target"></div>
                `;
            } else if (view === 'suspects') {
                container.innerHTML = `
                    <div class="case-card">
                        <div class="card-header">👥 استجواب المشتبه فيهم</div>
                        <div class="action-grid" style="margin-top: 10px;">
                            <button class="action-btn" onclick="interrogate('s1')">🤵 خالد (الشريك)</button>
                            <button class="action-btn" onclick="interrogate('s2')">💃 مريم (الزوجة)</button>
                            <button class="action-btn" onclick="interrogate('s3')">👨‍🍳 سعيد (الخادم)</button>
                        </div>
                    </div>
                    <div id="dialogue-target"></div>
                `;
            } else if (view === 'clues') {
                let cluesHtml = cluesFound.map(c => `
                    <div style="background:#1f2937; padding:8px; border-radius:4px; margin-bottom:6px; border-right:3px solid #f59e0b;">
                        <b style="color:#f59e0b; font-size:12px;">${c.name}</b>
                        <p style="font-size:11px; color:#cbd5e1; margin-top:2px;">${c.text}</p>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="case-card">
                        <div class="card-header">📁 الأدلة المسجلة (${cluesFound.length}/4)</div>
                        <div class="card-body" style="margin-top:10px;">
                            ${cluesFound.length === 0 ? "لم تجمع أي أدلة بعد. قم بتفتيش مسرح الجريمة!" : cluesHtml}
                        </div>
                    </div>
                `;
            } else if (view === 'accuse') {
                container.innerHTML = `
                    <div class="case-card">
                        <div class="card-header">⚖️ إصدار أمر القبض والإدانة</div>
                        <div class="card-body">
                            بناءً على الأدلة والتحقيقات، حدد القاتل الحقيقي المرتكب للجريمة:
                            <select id="suspect-select" class="suspect-select">
                                <option value="s1">خالد (الشريك التجاري)</option>
                                <option value="s2">مريم (الزوجة)</option>
                                <option value="s3">سعيد (الخادم)</option>
                            </select>
                            <button class="accuse-btn" onclick="makeAccusation()">🚨 إغلاق القضية والقبض على الجاني</button>
                        </div>
                    </div>
                `;
            }
        }

        function inspect(key) {
            if (points <= 0) {
                alert("نفذت نقاط التحقيق المتاحة لدي اليوم!");
                return;
            }
            const clue = cluesData[key];
            if (!cluesFound.some(c => c.name === clue.name)) {
                cluesFound.push(clue);
                points--;
                updateUI();
            }
            document.getElementById('dialogue-target').innerHTML = `
                <div class="dialogue-box">
                    <b>🔍 نتيجة المعاينة:</b><br>${clue.text}
                </div>
            `;
        }

        function interrogate(key) {
            if (points <= 0) {
                alert("نفذت نقاط التحقيق!");
                return;
            }
            const s = suspectsData[key];
            points--;
            updateUI();
            document.getElementById('dialogue-target').innerHTML = `
                <div class="dialogue-box">
                    <b>🗣️ أقوال ${s.name}:</b><br>"${s.dialogue}"
                </div>
            `;
        }

        function makeAccusation() {
            const selected = document.getElementById('suspect-select').value;
            if (selected === 's2') {
                alert("🎉 مبروك يا سيادة المحقق! إجابة صحيحة 100%!\n\nالجاني هي الزوجة (مريم)؛ حيث وضعت المنوم في الكأس واستخدمت دبوس الزينة الخاص بها لإخفاء معالم السرقات والديون.");
            } else {
                alert("❌ اتهام خاطئ! الجاني الحقيقي استغل عدم تركيزك وربح القضية وفَر هارباً.");
            }
        }

        // تشغيل البداية
        switchView('scene');
        updateUI();
    </script>
</body>
</html>
