<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة التحدي والمسابقات الكاملة</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --correct: #22c55e;
      --wrong: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 650px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }

    h1 {
      color: var(--accent);
      margin-bottom: 20px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .btn {
      background-color: var(--accent);
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
      max-width: 300px;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .option-btn {
      background-color: #334155;
      color: var(--text);
      border: 2px solid transparent;
      padding: 14px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      text-align: right;
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: var(--accent);
    }

    .option-btn.correct {
      background-color: var(--correct) !important;
      color: white;
    }

    .option-btn.wrong {
      background-color: var(--wrong) !important;
      color: white;
    }

    .header-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: #94a3b8;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }

    .question-text {
      font-size: 20px;
      margin: 20px 0;
      line-height: 1.5;
      min-height: 60px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- شاشة البداية -->
    <div id="start-screen" class="screen active">
      <h1>لعبة التحدي الكبرى 🎯</h1>
      <p style="margin-bottom: 20px;">اختر القسم للبدء في التحدي والمستويات المتعددة:</p>
      <button class="btn" onclick="startGame('movies')">🎬 سينما وأفلام</button>
      <button class="btn" onclick="startGame('general')">🌍 معلومات عامة</button>
    </div>

    <!-- شاشة اللعب -->
    <div id="quiz-screen" class="screen">
      <div class="header-info">
        <span id="category-tag">القسم</span>
        <span id="level-tag">المستوى 1</span>
        <span id="score-tag">النقاط: 0</span>
      </div>
      <div class="question-text" id="question-box">جاري تحميل السؤال...</div>
      <div class="options-grid" id="options-box"></div>
    </div>

    <!-- شاشة النهاية -->
    <div id="end-screen" class="screen">
      <h1>🏆 مبروك! أكملت التحدي بنجاح</h1>
      <p style="font-size: 20px; margin: 20px 0;" id="final-score"></p>
      <button class="btn" onclick="restartGame()">الرجوع للقائمة الرئيسية</button>
    </div>
  </div>

  <script>
    // بنك الأسئلة الشامل بجميع المستويات والأسئلة الاحتياطية المدمجة
    const questionBank = {
      movies: {
        level_1: [
          { q: "في أي مدينة تدور أحداث فيلم Spider-Man؟", options: ["بروك", "جام", "نوم", "نيويورك"], correct: "نيويورك" },
          { q: "ما اسم الكوكب الأصلي لشخصية سوبرمان؟", options: ["نيويورك", "لوس أنجلوس", "شيكاغو", "ميامي"], correct: "نيويورك" },
          { q: "من هو المخرج الشهير لسلسلة أفلام Jurassic Park؟", options: ["كريبتون", "هاريس", "تيتان", "أسغارد"], correct: "كريبتون" },
          { q: "احتياطي 1: ما هي الجائزة السينمائية الأرفع شأناً في فرنسا؟", options: ["سيزار", "نولان", "سكورسيزي", "لوكاس"], correct: "سيزار" },
          { q: "احتياطي 2: من أدّى دور جاك داوسون في فيلم Titanic؟", options: ["الأوسكار", "بافتا", "الغولدن غلوب", "ليوناردو دي كابريو"], correct: "ليوناردو دي كابريو" },
          { q: "احتياطي 3: ما اسم الشخصية الرئيسية الخضراء في فيلم Ogres؟", options: ["ليوناردو دي كابريو", "توم هانكس", "مت ديمون", "كيانو ريفز"], correct: "شريك" }
        ],
        level_2: [
          { q: "ما اسم المطرقة الخارقة الخاصة بشخصية ثور؟", options: ["شريك", "فيونا", "دونكي", "فاركواد"], correct: "ميولنير" },
          { q: "ما هو اسم الدمية المسكونة الشهيرة في عالم Conjuring؟", options: ["ميولنير", "ستورم بريكر", "ايجيس", "اسكالبر"], correct: "أنابل" },
          { q: "أي فيلم حصد 11 جائزة أوسكار وكان مستوحى من كتاب؟", options: ["أنابل", "تشانكي", "سليندرمان", "بيني وايز"], correct: "Lord of the Rings" }
        ],
        level_3: [
          { q: "من قام بصوت شخصية جيني في فيلم علاء الدين؟", options: ["Lord of the Rings", "Gladiator", "Braveheart", "Forrest Gump"], correct: "روبن وليامز" },
          { q: "ما هي حبوب الدواء التي نختارها نيو في The Matrix؟", options: ["روبن وليامز", "إد مورفي", "جيم كاري", "الدين 1992"], correct: "الحبة الحمراء" },
          { q: "من مخرج فيلم Pulp Fiction؟", options: ["الحبة الحمراء", "الحبة الزرقاء", "الحبة الخضراء", "للخروج؟"], correct: "كوينتن تارانتينو" }
        ],
        level_4: [
          { q: "ما اسم مدينة ديزني في فيلم Zootopia؟", options: ["كوانتين تارانتينو", "فينتشر", "سكورسيزي", "سبيلبرغ"], correct: "زوتوبيا" },
          { q: "ما هو الاسم الحقيقي لشخصية ولفيرين في فيلم Wolverine؟", options: ["زوتوبيا", "متروبوليس", "غوثام", "أتلانتس"], correct: "لوغان" },
          { q: "شخصية فولدمورت هي في أي سلسلة أفلام؟", options: ["هيو جاكمان", "كريستيان بيل", "بن أفليك", "توم هاردي"], correct: "هاري بوتر" }
        ]
      },
      general: {
        level_1: [
          { q: "ما هي أكبر قارة في العالم؟", options: ["آسيا", "إفريقيا", "أوروبا", "أمريكا الشمالية"], correct: "آسيا" },
          { q: "ما هي عاصمة أستراليا؟", options: ["كانبرا", "سيدني", "ملبورن", "بريزبان"], correct: "كانبرا" },
          { q: "ما هو أطول نهر في العالم؟", options: ["نهر النيل", "الأمازون", "الميسيسيبي", "الراين"], correct: "نهر النيل" },
          { q: "احتياطي 1: ما هي اللغة الأكثر تحدثاً كأول لغة في العالم؟", options: ["الصينية المندرين", "الإنجليزية", "الإسبانية", "العربية"], correct: "الصينية المندرين" }
        ],
        level_2: [
          { q: "ما هي أكبر دولة في العالم من حيث المساحة؟", options: ["روسيا", "كندا", "الصين", "أمريكا"], correct: "روسيا" },
          { q: "ما هي عاصمة اليابان؟", options: ["طوكيو", "أوساكا", "كيوتو", "سابورو"], correct: "طوكيو" },
          { q: "احتياطي 1: ما هي العملة الرسمية في المملكة المتحدة؟", options: ["الجنيه الإسترليني", "اليورو", "الدولار", "الفرنك"], correct: "الجنيه الإسترليني" }
        ],
        level_3: [
          { q: "كم عدد قارات العالم؟", options: ["7 قارات", "6 قارات", "8 قارات", "5 قارات"], correct: "7 قارات" },
          { q: "ما هي عاصمة كندا الرسمية؟", options: ["أوتاوا", "تورونتو", "مونتريال", "فانكوفر"], correct: "أوتاوا" },
          { q: "أي محيط يفصل بين القارة الآسيوية والأمريكية؟", options: ["المحيط الهادئ", "المحيط الأطلسي", "المحيط الهندي", "المحيط المتجمد"], correct: "المحيط الهادئ" }
        ],
        level_4: [
          { q: "ما هي أعمق نقطة في محيطات العالم؟", options: ["خندق ماريانا", "خندق بورتوريكو", "خندق جاوا", "خندق تونغا"], correct: "خندق ماريانا" },
          { q: "ما هي الصحراء الكبرى الأكبر في العالم (الباردة)؟", options: ["القارة القطبية الجنوبية", "الصحراء الكبرى", "صحراء جوبي", "أتاما"], correct: "القارة القطبية الجنوبية" },
          { q: "ما هي عاصمة دولة السويد؟", options: ["ستوكهولم", "أوسلو", "هلسنكي", "كوبنهاغن"], correct: "ستوكهولم" }
        ]
      }
    };

    let currentCategory = '';
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let score = 0;
    let activeQuestionsList = [];

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startGame(category) {
      currentCategory = category;
      currentLevel = 1;
      score = 0;
      showScreen('quiz-screen');
      prepareLevelQuestions();
    }

    function prepareLevelQuestions() {
      const levelKey = `level_${currentLevel}`;
      const questionsData = questionBank[currentCategory]?.[levelKey];

      if (!questionsData || questionsData.length === 0) {
        // الانتقال للمستوى التالي إذا وجد، وإلا ننهي اللعبة
        currentLevel++;
        if (questionBank[currentCategory][`level_${currentLevel}`]) {
          prepareLevelQuestions();
        } else {
          endGame();
        }
        return;
      }

      // خلط الأسئلة المتاحة للمستوى (تتضمن الأسئلة الأساسية والاحتياطية)
      activeQuestionsList = [...questionsData].sort(() => Math.random() - 0.5);
      currentQuestionIndex = 0;
      loadQuestion();
    }

    function loadQuestion() {
      if (currentQuestionIndex >= activeQuestionsList.length) {
        // الانتقال للمستوى التالي
        currentLevel++;
        if (questionBank[currentCategory][`level_${currentLevel}`]) {
          prepareLevelQuestions();
        } else {
          endGame();
        }
        return;
      }

      const qData = activeQuestionsList[currentQuestionIndex];
      document.getElementById('category-tag').innerText = currentCategory === 'movies' ? '🎬 سينما' : '🌍 معلومات عامة';
      document.getElementById('level-tag').innerText = `المستوى ${currentLevel}`;
      document.getElementById('score-tag').innerText = `النقاط: ${score}`;
      document.getElementById('question-box').innerText = qData.q;

      const optionsBox = document.getElementById('options-box');
      optionsBox.innerHTML = '';

      // خلط الخيارات لكي لا تكون في نفس المكان دائماً
      const shuffledOptions = [...qData.options].sort(() => Math.random() - 0.5);

      shuffledOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(btn, opt, qData.correct);
        optionsBox.appendChild(btn);
      });
    }

    function selectAnswer(btn, selected, correct) {
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.disabled = true);

      if (selected === correct) {
        btn.classList.add('correct');
        score += 10;
      } else {
        btn.classList.add('wrong');
        allBtns.forEach(b => {
          if (b.innerText === correct) b.classList.add('correct');
        });
      }

      setTimeout(() => {
        currentQuestionIndex++;
        loadQuestion();
      }, 1200);
    }

    function endGame() {
      showScreen('end-screen');
      document.getElementById('final-score').innerText = `مجموع نقاطك النهائي: ${score}`;
    }

    function restartGame() {
      showScreen('start-screen');
    }
  </script>
</body>
</html>
