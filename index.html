<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لعبة محاكي الدول</title>
    <style>
      :root {
        --bg: #07141f;
        --panel: rgba(10, 25, 39, 0.9);
        --panel-alt: rgba(14, 39, 58, 0.95);
        --line: #2de2ff;
        --gold: #ffd166;
        --green: #5eead4;
        --red: #ff6b6b;
        --text: #edf7ff;
        --muted: #a7c7d9;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #050d16 0%, #0d1d2d 100%);
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        align-items: stretch;
        padding: 16px;
      }

      .game {
        width: min(1400px, 100%);
        height: min(92vh, 900px);
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(300px, 420px);
        grid-template-rows: 80px minmax(0, 1fr) 110px;
        gap: 12px;
      }

      .header, .sidebar, .board, .footer {
        background: var(--panel);
        border: 1px solid rgba(45, 226, 255, 0.4);
        border-radius: 18px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      }

      .header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: linear-gradient(90deg, rgba(11, 41, 60, 1), rgba(14, 62, 91, 0.8));
      }

      .title {
        font-size: clamp(22px, 2vw, 32px);
        font-weight: 800;
        letter-spacing: 0.5px;
        color: var(--gold);
        text-shadow: 0 0 12px rgba(255, 209, 102, 0.5);
      }

      .turn-box {
        font-size: 18px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(255, 209, 102, 0.5);
        background: rgba(255, 209, 102, 0.08);
        color: var(--gold);
        font-weight: 700;
      }

      .board {
        position: relative;
        overflow: hidden;
        background: radial-gradient(circle at top, rgba(22, 69, 98, 0.8) 0%, rgba(7, 20, 31, 1) 58%);
      }

      #mapCanvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
      }

      .tooltip {
        position: absolute;
        display: none;
        min-width: 180px;
        background: rgba(9, 25, 38, 0.96);
        border: 1px solid rgba(45, 226, 255, 0.8);
        box-shadow: 0 0 18px rgba(45, 226, 255, 0.25);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.7;
        z-index: 10;
        pointer-events: none;
      }

      .sidebar {
        background: linear-gradient(180deg, rgba(12, 25, 39, 0.98), rgba(16, 34, 49, 0.96));
        padding: 16px;
        overflow-y: auto;
      }

      .panel {
        background: rgba(12, 31, 46, 0.85);
        border: 1px solid rgba(45, 226, 255, 0.25);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 14px;
      }

      .panel h3 {
        margin: 0 0 12px;
        font-size: 18px;
        color: var(--line);
      }

      .stat {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: var(--muted);
        padding: 4px 0;
        font-size: 14px;
      }

      .stat strong {
        color: var(--text);
      }

      .bar {
        width: 100%;
        height: 8px;
        background: rgba(255,255,255,0.08);
        border-radius: 999px;
        overflow: hidden;
        margin: 6px 0 10px;
      }

      .bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--green), var(--line));
        border-radius: inherit;
      }

      .list {
        display: grid;
        gap: 8px;
      }

      .list-item {
        background: rgba(45, 226, 255, 0.06);
        border: 1px solid rgba(45, 226, 255, 0.18);
        border-radius: 8px;
        padding: 8px 10px;
        color: var(--text);
        font-size: 13px;
        line-height: 1.6;
      }

      .list-item button {
        width: 100%;
        margin-top: 6px;
      }

      .footer {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(6, minmax(120px, 1fr));
        gap: 10px;
        padding: 12px;
        background: linear-gradient(180deg, rgba(13, 34, 49, 0.96), rgba(9, 21, 30, 1));
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
        color: #08181f;
        background: linear-gradient(135deg, #7dd3fc, #38bdf8);
      }

      button.secondary {
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
      }

      button.danger {
        background: linear-gradient(135deg, #fca5a5, #ef4444);
      }

      button.success {
        background: linear-gradient(135deg, #6ee7b7, #10b981);
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.05);
      }

      .notify {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        min-width: 260px;
        max-width: 440px;
        padding: 12px 16px;
        border-radius: 12px;
        text-align: center;
        font-weight: 700;
        letter-spacing: 0.3px;
        display: none;
        z-index: 100;
        border: 1px solid rgba(255,255,255,0.26);
        box-shadow: 0 12px 20px rgba(0,0,0,0.35);
      }

      .notify.show {
        display: block;
        animation: appear 0.25s ease;
      }

      .notify.info { background: rgba(14, 116, 144, 0.9); }
      .notify.success { background: rgba(16, 185, 129, 0.9); }
      .notify.warn { background: rgba(245, 158, 11, 0.9); }
      .notify.error { background: rgba(239, 68, 68, 0.9); }

      @keyframes appear {
        from { opacity: 0; transform: translateX(-50%) translateY(8px); }
        to { opacity: 1; transform: translateX(-50%) translateY(0); }
      }

      @media (max-width: 1024px) {
        .game {
          grid-template-columns: 1fr;
          grid-template-rows: 80px 1fr 1fr 110px;
        }

        .sidebar {
          overflow: visible;
        }

        .footer {
          grid-template-columns: repeat(2, minmax(120px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="game">
      <header class="header">
        <div class="title">🌍 لعبة محاكي الدول</div>
        <div class="turn-box">الدور: <span id="turnCounter">1</span></div>
      </header>

      <main class="board">
        <canvas id="mapCanvas"></canvas>
        <div id="tooltip" class="tooltip"></div>
      </main>

      <aside class="sidebar">
        <section class="panel">
          <h3>🏛️ دولتك</h3>
          <div id="countryInfo"></div>
        </section>

        <section class="panel">
          <h3>💰 الموارد</h3>
          <div id="resourceInfo"></div>
        </section>

        <section class="panel">
          <h3>⚔️ الجيش</h3>
          <div id="militaryInfo"></div>
        </section>

        <section class="panel">
          <h3>🤝 الدول القريبة</h3>
          <div id="nearbyNations" class="list"></div>
        </section>
      </aside>

      <footer class="footer">
        <button id="nextTurnBtn">⏭️ الدور التالي</button>
        <button id="collectTaxBtn" class="secondary">💵 جمع الضرائب</button>
        <button id="trainArmyBtn" class="success">👮 تدريب جيش</button>
        <button id="buildBtn" class="secondary">🏗️ بناء بنية</button>
        <button id="tradeBtn">🤝 تجارة</button>
        <button id="attackBtn" class="danger">⚔️ هجوم</button>
      </footer>
    </div>

    <div id="notify" class="notify"></div>

    <script>
      const NATIONS = [
        { name: 'مصر', capital: 'القاهرة', x: 21, y: 35, flag: '🇪🇬', color: '#ffd166' },
        { name: 'السعودية', capital: 'الرياض', x: 35, y: 24, flag: '🇸🇦', color: '#8ecae6' },
        { name: 'الإمارات', capital: 'أبو ظبي', x: 48, y: 26, flag: '🇦🇪', color: '#90be6d' },
        { name: 'تركيا', capital: 'أنقرة', x: 34, y: 56, flag: '🇹🇷', color: '#f4a261' },
        { name: 'إيران', capital: 'طهران', x: 61, y: 44, flag: '🇮🇷', color: '#ffb703' },
        { name: 'العراق', capital: 'بغداد', x: 43, y: 42, flag: '🇮🇶', color: '#a3b18a' },
        { name: 'الأردن', capital: 'عمّان', x: 31, y: 42, flag: '🇯🇴', color: '#9ad0c2' },
        { name: 'سوريا', capital: 'دمشق', x: 37, y: 48, flag: '🇸🇾', color: '#d9ed92' },
        { name: 'لبنان', capital: 'بيروت', x: 36, y: 52, flag: '🇱🇧', color: '#f7b267' },
        { name: 'باكستان', capital: 'إسلام أباد', x: 71, y: 42, flag: '🇵🇰', color: '#76c893' }
      ];

      const RESOURCE_NAMES = [
        { key: 'money', label: '💵 نقد', max: 20000 },
        { key: 'food', label: '🌾 غذاء', max: 3000 },
        { key: 'wood', label: '🌳 خشب', max: 2200 },
        { key: 'stone', label: '🪨 حجر', max: 1800 },
        { key: 'oil', label: '🛢️ نفط', max: 1500 },
        { key: 'metal', label: '⚒️ معدن', max: 1700 }
      ];

      const game = {
        turn: 1,
        playerName: 'مصر',
        nations: [],
        selectedNation: null,
        log: []
      };

      function initGame() {
        game.nations = NATIONS.map((n) => ({
          ...n,
          population: 10000000,
          happiness: 70,
          technology: 1,
          production: 1.0,
          taxRate: 0.15,
          alliances: [],
          resources: {
            money: 7000 + Math.floor(Math.random() * 3000),
            food: 1500 + Math.floor(Math.random() * 500),
            wood: 1000 + Math.floor(Math.random() * 400),
            stone: 800 + Math.floor(Math.random() * 300),
            oil: 600 + Math.floor(Math.random() * 250),
            metal: 900 + Math.floor(Math.random() * 350)
          },
          military: {
            soldiers: 1200,
            tanks: 50,
            aircraft: 18,
            navy: 10
          },
          isPlayer: n.name === game.playerName
        }));

        game.selectedNation = game.nations.find((n) => n.isPlayer);
        renderAll();
      }

      function getNationByName(name) {
        return game.nations.find((n) => n.name === name);
      }

      function notify(message, type = 'info', duration = 2200) {
        const box = document.getElementById('notify');
        box.textContent = message;
        box.className = `notify show ${type}`;
        clearTimeout(notify.timer);
        notify.timer = setTimeout(() => box.classList.remove('show'), duration);
      }

      function renderAll() {
        renderHeader();
        renderCountryInfo();
        renderResourceInfo();
        renderMilitaryInfo();
        renderNearby();
        renderMap();
      }

      function renderHeader() {
        document.getElementById('turnCounter').textContent = game.turn;
      }

      function renderCountryInfo() {
        const country = game.selectedNation || game.nations[0];
        const stat = [
          ['الدولة', `${country.flag} ${country.name}`],
          ['العاصمة', country.capital],
          ['السكان', `${(country.population / 1000000).toFixed(1)} مليون`],
          ['السعادة', `${country.happiness}%`],
          ['التكنولوجيا', `المستوى ${country.technology}`],
          ['الإنتاج', `${country.production.toFixed(2)}x`],
          ['التحالفات', country.alliances.length || 0]
        ];

        const html = stat.map(([label, value]) => `
          <div class="stat"><span>${label}</span><strong>${value}</strong></div>
        `).join('');

        document.getElementById('countryInfo').innerHTML = html;
      }

      function renderResourceInfo() {
        const country = game.selectedNation || game.nations[0];
        const total = RESOURCE_NAMES.reduce((sum, item) => sum + country.resources[item.key], 0);
        const html = RESOURCE_NAMES.map((item) => {
          const value = country.resources[item.key];
          const pct = Math.min(100, (value / item.max) * 100);
          return `
            <div>
              <div class="stat"><span>${item.label}</span><strong>${value.toLocaleString()}</strong></div>
              <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
            </div>
          `;
        }).join('');

        document.getElementById('resourceInfo').innerHTML = `
          <div class="stat"><span>القيمة الإجمالية</span><strong>${total.toLocaleString()}</strong></div>
          ${html}
        `;
      }

      function renderMilitaryInfo() {
        const country = game.selectedNation || game.nations[0];
        const power = militaryPower(country);
        const html = `
          <div class="stat"><span>👮 الجنود</span><strong>${country.military.soldiers.toLocaleString()}</strong></div>
          <div class="stat"><span>🚗 الدبابات</span><strong>${country.military.tanks.toLocaleString()}</strong></div>
          <div class="stat"><span>✈️ الطائرات</span><strong>${country.military.aircraft.toLocaleString()}</strong></div>
          <div class="stat"><span>🚢 السفن</span><strong>${country.military.navy.toLocaleString()}</strong></div>
          <div class="stat"><span>⚡ القوة</span><strong>${power.toLocaleString()}</strong></div>
        `;
        document.getElementById('militaryInfo').innerHTML = html;
      }

      function renderNearby() {
        const country = game.selectedNation || game.nations[0];
        const nearby = game.nations.filter((n) => n.name !== country.name && distance(country, n) <= 42)
          .sort((a, b) => distance(country, a) - distance(country, b));

        const list = nearby.length
          ? nearby.map((n) => `
              <div class="list-item">
                ${n.flag} ${n.name}<br>
                المسافة: ${distance(country, n).toFixed(1)}<br>
                القوة: ${militaryPower(n).toLocaleString()}
              </div>
            `).join('')
          : '<div class="list-item">لا توجد دول قريبة حالياً.</div>';

        document.getElementById('nearbyNations').innerHTML = list;
      }

      function renderMap() {
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;

        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);

        // Background ocean
        const ocean = ctx.createLinearGradient(0, 0, 0, h);
        ocean.addColorStop(0, '#0c2a45');
        ocean.addColorStop(1, '#07141f');
        ctx.fillStyle = ocean;
        ctx.fillRect(0, 0, w, h);

        // Grid
        ctx.strokeStyle = 'rgba(147, 197, 253, 0.08)';
        ctx.lineWidth = 1;
        for (let x = 0; x <= w; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, h);
          ctx.stroke();
        }
        for (let y = 0; y <= h; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(w, y);
          ctx.stroke();
        }

        // Alliance lines
        game.nations.forEach((a) => {
          a.alliances.forEach((targetName) => {
            const b = getNationByName(targetName);
            if (!b) return;
            ctx.beginPath();
            ctx.moveTo(mapX(a.x), mapY(a.y));
            ctx.lineTo(mapX(b.x), mapY(b.y));
            ctx.strokeStyle = 'rgba(94, 234, 212, 0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();
          });
        });

        // Nations
        game.nations.forEach((nation) => {
          const px = mapX(nation.x);
          const py = mapY(nation.y);
          const isSelected = game.selectedNation && game.selectedNation.name === nation.name;
          const radius = isSelected ? 12 : 10;

          ctx.beginPath();
          ctx.fillStyle = nation.color;
          ctx.arc(px, py, radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.beginPath();
          ctx.strokeStyle = isSelected ? '#facc15' : 'rgba(255,255,255,0.8)';
          ctx.lineWidth = isSelected ? 3 : 2;
          ctx.arc(px, py, radius + (isSelected ? 4 : 2), 0, Math.PI * 2);
          ctx.stroke();

          ctx.font = '12px sans-serif';
          ctx.fillStyle = '#edf7ff';
          ctx.textAlign = 'center';
          ctx.fillText(`${nation.flag} ${nation.name}`, px, py - 16);
        });
      }

      function mapX(value) {
        return (value / 100) * document.getElementById('mapCanvas').width;
      }

      function mapY(value) {
        return (value / 100) * document.getElementById('mapCanvas').height;
      }

      function distance(a, b) {
        return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
      }

      function militaryPower(nation) {
        return nation.military.soldiers + nation.military.tanks * 18 + nation.military.aircraft * 25 + nation.military.navy * 30;
      }

      function collectTaxes() {
        const country = game.selectedNation;
        country.resources.money += Math.floor((country.population * country.taxRate) / 1000);
        notify('💵 تم جمع الضرائب بنجاح!', 'success');
        renderAll();
      }

      function trainArmy() {
        const country = game.selectedNation;
        const cost = { money: 3000, metal: 150 };
        if (country.resources.money < cost.money || country.resources.metal < cost.metal) {
          notify('❌ لا توجد موارد كافية لتدريب الجيش', 'error');
          return;
        }

        country.resources.money -= cost.money;
        country.resources.metal -= cost.metal;
        country.military.soldiers += 180;
        country.military.tanks += 5;
        country.military.aircraft += 2;
        notify('✅ تم تدريب جيش جديد بنجاح!', 'success');
        renderAll();
      }

      function buildInfrastructure() {
        const country = game.selectedNation;
        const cost = { money: 5000, wood: 180, stone: 180, metal: 200 };
        if (country.resources.money < cost.money || country.resources.wood < cost.wood || country.resources.stone < cost.stone || country.resources.metal < cost.metal) {
          notify('❌ لا توجد موارد كافية للبنية', 'error');
          return;
        }

        country.resources.money -= cost.money;
        country.resources.wood -= cost.wood;
        country.resources.stone -= cost.stone;
        country.resources.metal -= cost.metal;
        country.technology += 1;
        country.production += 0.12;
        country.happiness = Math.min(100, country.happiness + 3);
        notify('🏗️ تم بناء البنية التحتية بنجاح!', 'success');
        renderAll();
      }

      function performTrade() {
        const player = game.selectedNation;
        const targets = game.nations.filter((n) => n.name !== player.name && distance(player, n) <= 42);
        if (!targets.length) {
          notify('❌ لا توجد دول قريبة للتجارة!', 'warn');
          return;
        }

        const target = targets[Math.floor(Math.random() * targets.length)];
        const amount = 1500 + Math.floor(Math.random() * 2000);

        if (player.resources.money < amount) {
          notify('❌ لا تملك ما يكفي من المال للتجارة!', 'error');
          return;
        }

        player.resources.money -= amount;
        target.resources.money += amount;
        player.resources.food += Math.floor(amount / 4);
        target.resources.food -= Math.floor(amount / 4);

        player.alliances.push(target.name);
        target.alliances.push(player.name);
        notify(`🤝 تم عقد صفقة تجارية مع ${target.name}!`, 'success');
        renderAll();
      }

      function attackTarget() {
        const player = game.selectedNation;
        const targets = game.nations.filter((n) => n.name !== player.name && distance(player, n) <= 42);
        if (!targets.length) {
          notify('❌ لا توجد دول قريبة للهجوم!', 'warn');
          return;
        }

        const target = targets[Math.floor(Math.random() * targets.length)];
        const playerPower = militaryPower(player);
        const targetPower = militaryPower(target);
        const winChance = playerPower / (playerPower + targetPower || 1);
        const attackResult = Math.random() < winChance ? 'win' : 'lose';

        if (attackResult === 'win') {
          const lootMoney = Math.floor(target.resources.money * 0.25);
          const lootMetal = Math.floor(target.resources.metal * 0.2);
          const lootOil = Math.floor(target.resources.oil * 0.15);

          player.resources.money += lootMoney;
          player.resources.metal += lootMetal;
          player.resources.oil += lootOil;

          target.resources.money -= lootMoney;
          target.resources.metal -= lootMetal;
          target.resources.oil -= lootOil;

          player.military.soldiers = Math.max(0, player.military.soldiers - Math.floor(player.military.soldiers * 0.08));
          target.military.soldiers = Math.max(0, target.military.soldiers - Math.floor(target.military.soldiers * 0.15));

          notify(`🏆 انتصر ${player.name} على ${target.name}!`, 'success');
        } else {
          player.resources.money = Math.max(0, player.resources.money - 1500);
          player.military.soldiers = Math.max(0, player.military.soldiers - Math.floor(player.military.soldiers * 0.12));
          target.military.soldiers = Math.max(0, target.military.soldiers - Math.floor(target.military.soldiers * 0.08));
          notify(`💔 خسرت ${player.name} الهجوم على ${target.name}!`, 'error');
        }

        game.log.unshift({
          date: `الدور ${game.turn}`,
          text: `${player.name} ${attackResult === 'win' ? 'انتصرت' : 'خسرت'} على ${target.name}`
        });

        renderAll();
      }

      function nextTurn() {
        game.turn += 1;

        game.nations.forEach((nation) => {
          if (nation.name === game.selectedNation.name) return;

          nation.resources.food += Math.floor(400 * nation.production);
          nation.resources.money += Math.floor(700 * nation.production);
          nation.resources.wood += Math.floor(240 * nation.production);
          nation.resources.stone += Math.floor(160 * nation.production);
          nation.resources.oil += Math.floor(130 * nation.production);
          nation.resources.metal += Math.floor(200 * nation.production);

          if (Math.random() < 0.25) {
            nation.military.soldiers += 50 + Math.floor(Math.random() * 80);
          }
          if (Math.random() < 0.15) {
            nation.technology += 1;
          }
        });

        // Player resources per turn
        const player = game.selectedNation;
        player.resources.food += 250;
        player.resources.money += 800;
        player.resources.wood += 180;
        player.resources.stone += 140;
        player.resources.oil += 100;
        player.resources.metal += 180;

        player.population = Math.max(1, Math.floor(player.population * (1 + (player.happiness / 1000))));
        player.happiness = Math.max(10, Math.min(100, player.happiness + (Math.random() > 0.5 ? 2 : -2)));

        notify('🔄 بدأ دور جديد!', 'info');
        renderAll();
      }

      function handleCanvasClick(event) {
        const rect = event.currentTarget.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        let chosen = null;
        for (const nation of game.nations) {
          const nx = mapX(nation.x);
          const ny = mapY(nation.y);
          const dist = Math.hypot(x - nx, y - ny);
          if (dist <= 18) {
            chosen = nation;
            break;
          }
        }

        if (chosen) {
          game.selectedNation = chosen;
          renderAll();
        }
      }

      function handleCanvasMove(event) {
        const rect = event.currentTarget.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        const tooltip = document.getElementById('tooltip');

        let hit = null;
        for (const nation of game.nations) {
          const nx = mapX(nation.x);
          const ny = mapY(nation.y);
          const dist = Math.hypot(x - nx, y - ny);
          if (dist <= 18) {
            hit = nation;
            break;
          }
        }

        if (!hit) {
          tooltip.style.display = 'none';
          return;
        }

        tooltip.innerHTML = `
          <div><strong>${hit.flag} ${hit.name}</strong></div>
          <div>العاصمة: ${hit.capital}</div>
          <div>القوة: ${militaryPower(hit).toLocaleString()}</div>
          <div>السكان: ${(hit.population / 1000000).toFixed(1)}M</div>
          <div>السعادة: ${hit.happiness}%</div>
        `;
        tooltip.style.left = `${event.clientX + 14}px`;
        tooltip.style.top = `${event.clientY + 14}px`;
        tooltip.style.display = 'block';
      }

      document.getElementById('nextTurnBtn').addEventListener('click', nextTurn);
      document.getElementById('collectTaxBtn').addEventListener('click', collectTaxes);
      document.getElementById('trainArmyBtn').addEventListener('click', trainArmy);
      document.getElementById('buildBtn').addEventListener('click', buildInfrastructure);
      document.getElementById('tradeBtn').addEventListener('click', performTrade);
      document.getElementById('attackBtn').addEventListener('click', attackTarget);
      document.getElementById('mapCanvas').addEventListener('click', handleCanvasClick);
      document.getElementById('mapCanvas').addEventListener('mousemove', handleCanvasMove);
      document.getElementById('mapCanvas').addEventListener('mouseleave', () => document.getElementById('tooltip').style.display = 'none');

      window.addEventListener('resize', renderMap);
      initGame();
    </script>
  </body>
</html>
