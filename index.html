<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الهروب من القراصنة</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #0a2a4a 0%, #0e3a5f 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Tahoma', sans-serif;
    color: white;
    overflow: hidden;
  }
  h1 {
    margin-bottom: 10px;
    color: #ffd700;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }
  #hud {
    display: flex;
    gap: 30px;
    margin-bottom: 10px;
    font-size: 18px;
  }
  #progressBarBg {
    width: 500px;
    max-width: 90vw;
    height: 20px;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
    border: 2px solid rgba(255,255,255,0.3);
  }
  #progressBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2ecc71, #27ae60);
    transition: width 0.2s;
  }
  canvas {
    background: #1a5a8a;
    border: 4px solid #ffd700;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
    max-width: 95vw;
  }
  #msg {
    margin-top: 15px;
    font-size: 22px;
    font-weight: bold;
    min-height: 30px;
    text-align: center;
  }
  button {
    margin-top: 10px;
    padding: 10px 25px;
    font-size: 16px;
    background: #ffd700;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    display: none;
  }
  button:hover { background: #ffcc00; }
  #instructions {
    margin-top: 8px;
    font-size: 14px;
    color: #cfe8ff;
    text-align: center;
  }
</style>
</head>
<body>

<h1>⛵ الهروب من القراصنة 🏴‍☠️</h1>
<div id="hud">
  <div>❤️ حياة: <span id="lives">3</span></div>
  <div>⏱️ الوقت: <span id="timer">0</span> ث</div>
</div>
<div id="progressBarBg"><div id="progressBar"></div></div>
<canvas id="game" width="600" height="500"></canvas>
<div id="msg"></div>
<button id="restartBtn" onclick="startGame()">إعادة اللعب</button>
<div id="instructions">استخدم الأسهم أو W A S D للتحكم في المركب — اوصل لخط النهاية فوق وتجنب القراصنة!</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const livesEl = document.getElementById('lives');
const timerEl = document.getElementById('timer');
const msgEl = document.getElementById('msg');
const restartBtn = document.getElementById('restartBtn');
const progressBar = document.getElementById('progressBar');

let W = canvas.width, H = canvas.height;

let player, pirates, keys, gameOver, won, lives, worldY, startTime, elapsed, invincibleUntil;
let animId;

const FINISH_Y = -4000;
const TOTAL_DIST = Math.abs(FINISH_Y);

function initState() {
  player = { x: W/2, y: H - 80, w: 34, h: 50, speed: 4 };
  pirates = [];
  keys = {};
  gameOver = false;
  won = false;
  lives = 3;
  worldY = 0;
  startTime = Date.now();
  elapsed = 0;
  invincibleUntil = 0;
  livesEl.textContent = lives;
  timerEl.textContent = "0";
  progressBar.style.width = "0%";
  msgEl.textContent = "";
  restartBtn.style.display = "none";
  spawnInitialPirates();
}

function spawnInitialPirates() {
  for (let i = 0; i < 4; i++) {
    spawnPirate(-100 - i * 150);
  }
}

function spawnPirate(relativeY) {
  pirates.push({
    x: 40 + Math.random() * (W - 80),
    y: relativeY,
    w: 30,
    h: 44,
    speed: 1.2 + Math.random() * 1.3
  });
}

document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
});
document.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

function drawWater() {
  ctx.fillStyle = '#1a5a8a';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 2;
  const offset = (worldY * 0.5) % 40;
  for (let y = -40; y < H + 40; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y + offset);
    ctx.lineTo(W, y + offset);
    ctx.stroke();
  }
}

function boatShape(ctx, x, y, w, h, hullColor, sailColor) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = hullColor;
  ctx.beginPath();
  ctx.moveTo(-w/2, h/2);
  ctx.lineTo(w/2, h/2);
  ctx.lineTo(w/2 - 6, h/2 + 10);
  ctx.lineTo(-w/2 + 6, h/2 + 10);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = sailColor;
  ctx.beginPath();
  ctx.moveTo(0, -h/2);
  ctx.lineTo(w/2 - 4, h/4);
  ctx.lineTo(0, h/4);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#4a2f1a';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, -h/2);
  ctx.lineTo(0, h/2);
  ctx.stroke();
  ctx.restore();
}

function draw() {
  drawWater();

  const remaining = TOTAL_DIST - worldY;
  if (remaining < H + 200) {
    const finishScreenY = player.y - remaining;
    ctx.save();
    ctx.fillStyle = '#ffd700';
    for (let i = 0; i < W; i += 30) {
      ctx.fillStyle = (Math.floor(i/30) % 2 === 0) ? '#ffffff' : '#111';
      ctx.fillRect(i, finishScreenY - 10, 30, 20);
    }
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 20px Tahoma';
    ctx.textAlign = 'center';
    ctx.fillText('🏁 خط النهاية 🏁', W/2, finishScreenY - 20);
    ctx.restore();
  }

  pirates.forEach(p => {
    const screenY = player.y + (p.y - (-worldY));
    boatShape(ctx, p.x, screenY, p.w, p.h, '#3a1f1f', '#111');
    ctx.fillStyle = '#fff';
    ctx.font = '16px Tahoma';
    ctx.textAlign = 'center';
    ctx.fillText('🏴‍☠️', p.x, screenY - p.h/2 - 5);
  });

  const blinking = Date.now() < invincibleUntil && Math.floor(Date.now()/100) % 2 === 0;
  if (!blinking) {
    boatShape(ctx, player.x, player.y, player.w, player.h, '#3a2a1a', '#f5f0e0');
  }
}

function update() {
  if (gameOver) return;

  let dx = 0, dy = 0;
  if (keys['arrowleft'] || keys['a']) dx -= player.speed;
  if (keys['arrowright'] || keys['d']) dx += player.speed;
  if (keys['arrowup'] || keys['w']) dy -= player.speed;
  if (keys['arrowdown'] || keys['s']) dy += player.speed;

  player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x + dx));

  let progressDelta = -dy;
  worldY = Math.max(0, Math.min(TOTAL_DIST, worldY + progressDelta));
  player.y = Math.max(60, Math.min(H - 40, player.y + dy * 0.15));

  pirates.forEach(p => {
    p.y += p.speed;
    const dxp = player.x - p.x;
    p.x += Math.sign(dxp) * Math.min(Math.abs(dxp), 1.5);
  });

  pirates = pirates.filter(p => p.y < worldY + H + 50);
  while (pirates.length < 4 + Math.floor(worldY / 800)) {
    spawnPirate(worldY - H - Math.random()*300);
  }

  if (Date.now() > invincibleUntil) {
    pirates.forEach(p => {
      const screenY = player.y + (p.y - (-worldY));
      const distX = Math.abs(p.x - player.x);
      const distY = Math.abs(screenY - player.y);
      if (distX < (p.w + player.w)/2 - 8 && distY < (p.h + player.h)/2 - 8) {
        hitByPirate();
      }
    });
  }

  if (worldY >= TOTAL_DIST) {
    winGame();
  }

  progressBar.style.width = Math.min(100, (worldY / TOTAL_DIST) * 100) + "%";
  elapsed = Math.floor((Date.now() - startTime) / 1000);
  timerEl.textContent = elapsed;
}

function hitByPirate() {
  lives -= 1;
  livesEl.textContent = lives;
  invincibleUntil = Date.now() + 1500;
  if (lives <= 0) {
    loseGame();
  }
}

function loseGame() {
  gameOver = true;
  won = false;
  msgEl.style.color = '#ff5555';
  msgEl.textContent = '💀 القراصنة مسكوك! حاول تاني';
  restartBtn.style.display = 'inline-block';
  cancelAnimationFrame(animId);
}

function winGame() {
  gameOver = true;
  won = true;
  msgEl.style.color = '#2ecc71';
  msgEl.textContent = `🎉 وصلت لخط النهاية في ${elapsed} ثانية! نجوت من القراصنة`;
  restartBtn.style.display = 'inline-block';
  cancelAnimationFrame(animId);
}

function loop() {
  update();
  draw();
  if (!gameOver) {
    animId = requestAnimationFrame(loop);
  }
}

function startGame() {
  cancelAnimationFrame(animId);
  initState();
  loop();
}

startGame();
</script>
</body>
</html>
