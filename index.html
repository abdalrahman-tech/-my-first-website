<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>محاكي كرة القدم الفيزيائي</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        #scoreBoard {
            font-size: 24px;
            margin-bottom: 10px;
            background: #333;
            padding: 10px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        canvas {
            border: 4px solid #fff;
            background-color: #2e8b57;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .controls {
            margin-top: 15px;
            text-align: center;
            color: #ccc;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="scoreBoard">
    <span style="color: #ff4d4d;">الأحمر (أنت)</span> <span id="score">0 - 0</span> <span style="color: #4da6ff;">الأزرق (الكمبيوتر)</span>
</div>

<canvas id="gameCanvas" width="800" height="500"></canvas>

<div class="controls">
    <b>التحكم:</b> الأسهم (للحركة) | <b>Space</b> (تسديدة قوية) | <b>Shift</b> (جري سريع - يستهلك الطاقة)
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- الثوابت الفيزيائية (Physics Constants) ---
const FRICTION = 0.98; // معامل احتكاك الأرضية بالكرة
const BALL_RESTITUTION = 0.7; // معامل ارتداد الكرة عند الاصطدام

// --- بيانات المباراة ---
let scorePlayer = 0;
let scoreAI = 0;

// --- كائن الكرة (Ball Physics Object) ---
const ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 8,
    vx: 0,
    vy: 0,
    mass: 1,
    update: function() {
        // تطبيق الاحتكاك الفيزيائي
        this.vx *= FRICTION;
        this.vy *= FRICTION;

        // تحديث الموقع بناءً على السرعة
        this.x += this.vx;
        this.y += this.vy;

        // حدود الملعب والارتداد من الجدران
        if (this.y - this.radius < 10 || this.y + this.radius > canvas.height - 10) {
            this.vy *= -BALL_RESTITUTION;
            this.y = this.y - this.radius < 10 ? 10 + this.radius : canvas.height - 10 - this.radius;
        }

        // ارتداد الكرة من الخطوط الخلفية (خارج خط المرمى)
        if ((this.x - this.radius < 10 || this.x + this.radius > canvas.width - 10)) {
            // التحقق من الهدف
            if (this.y > 180 && this.y < 320) {
                if (this.x < 10) scoreAI++;
                else scorePlayer++;
                document.getElementById('score').innerText = `${scorePlayer} - ${scoreAI}`;
                resetPositions();
            } else {
                this.vx *= -BALL_RESTITUTION;
                this.x = this.x - this.radius < 10 ? 10 + this.radius : canvas.width - 10 - this.radius;
            }
        }
    },
    draw: function() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.strokeStyle = "#000";
        ctx.stroke();
        ctx.closePath();
    }
};

// --- كائن اللاعب (Player Class with Stamina & Dynamics) ---
class Player {
    constructor(x, y, color, isAI = false) {
        this.x = x;
        this.y = y;
        this.radius = 15;
        this.color = color;
        this.vx = 0;
        this.vy = 0;
        this.baseSpeed = 2.5;
        this.sprintSpeed = 4.5;
        this.stamina = 100; // الطاقة القصوى
        this.maxStamina = 100;
        this.isAI = isAI;
    }

    update(keys) {
        let currentSpeed = this.baseSpeed;

        // نظام الطاقة والجري السريع
        if (!this.isAI) {
            if (keys['Shift'] && this.stamina > 5) {
                currentSpeed = this.sprintSpeed;
                this.stamina -= 0.6; // استهلاك الطاقة
            } else if (this.stamina < this.maxStamina) {
                this.stamina += 0.25; // استرجاع الطاقة
            }

            // حركة اللاعب المدخلة
            this.vx = 0;
            this.vy = 0;
            if (keys['ArrowUp']) this.vy = -currentSpeed;
            if (keys['ArrowDown']) this.vy = currentSpeed;
            if (keys['ArrowLeft']) this.vx = -currentSpeed;
            if (keys['ArrowRight']) this.vx = currentSpeed;

        } else {
            // لوجيك ذكاء الاصطناعي (AI Dynamics)
            let dx = ball.x - this.x;
            let dy = ball.y - this.y;
            let dist = Math.hypot(dx, dy);

            // استهلاك واسترجاع طاقة الـ AI
            if (dist < 150 && this.stamina > 20) {
                currentSpeed = this.sprintSpeed;
                this.stamina -= 0.4;
            } else if (this.stamina < this.maxStamina) {
                this.stamina += 0.2;
            }

            if (dist > 5) {
                this.vx = (dx / dist) * currentSpeed;
                this.vy = (dy / dist) * currentSpeed;
            }
        }

        // تطبيق الحركة والحدود
        this.x += this.vx;
        this.y += this.vy;

        // منع الخروج من حدود الملعب
        this.x = Math.max(10 + this.radius, Math.min(canvas.width - 10 - this.radius, this.x));
        this.y = Math.max(10 + this.radius, Math.min(canvas.height - 10 - this.radius, this.y));

        // حساب التصادم الفيزيائي مع الكرة
        this.resolveBallCollision();
    }

    resolveBallCollision() {
        let dx = ball.x - this.x;
        let dy = ball.y - this.y;
        let distance = Math.hypot(dx, dy);

        if (distance < this.radius + ball.radius) {
            // حساب زاوية الارتطام الفيزيائي (Impulse Physics)
            let angle = Math.atan2(dy, dx);
            let power = Math.hypot(this.vx, this.vy) + 2;

            ball.vx = Math.cos(angle) * power * 1.5;
            ball.vy = Math.sin(angle) * power * 1.5;
        }
    }

    kickBall() {
        let dx = ball.x - this.x;
        let dy = ball.y - this.y;
        let distance = Math.hypot(dx, dy);

        // إمكانية التسديد فقط عند الاقتراب من الكرة
        if (distance < this.radius + ball.radius + 10) {
            let angle = Math.atan2(dy, dx);
            let kickPower = 10; // قوة التسديدة
            ball.vx = Math.cos(angle) * kickPower;
            ball.vy = Math.sin(angle) * kickPower;
        }
    }

    draw() {
        // رسم جسم اللاعب
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.closePath();

        // رسم شريط الطاقة فوق اللاعب (Stamina Bar)
        ctx.fillStyle = "#555";
        ctx.fillRect(this.x - 15, this.y - 25, 30, 4);
        ctx.fillStyle = this.stamina > 30 ? "#00ff00" : "#ff0000";
        ctx.fillRect(this.x - 15, this.y - 25, (this.stamina / this.maxStamina) * 30, 4);
    }
}

// --- إنشاء الأجسام ---
const player = new Player(200, 250, '#ff4d4d');
const ai = new Player(600, 250, '#4da6ff', true);
const keys = {};

// --- إدارة المدخلات (Events) ---
window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === ' ') player.kickBall(); // زر التسديد
});
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

function resetPositions() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
    ball.vx = 0;
    ball.vy = 0;
    player.x = 200; player.y = 250;
    ai.x = 600; ai.y = 250;
}

// --- رسم الملعب (Pitch Drawing) ---
function drawPitch() {
    ctx.fillStyle = "#2e8b57";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
    ctx.lineWidth = 3;

    // الحدود الخارجية
    ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

    // خط المنتصف والدائرة
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 10);
    ctx.lineTo(canvas.width / 2, canvas.height - 10);
    ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, Math.PI * 2);
    ctx.stroke();

    // المرمى الأيسر والأيمن
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fillRect(0, 180, 10, 140);
    ctx.fillRect(canvas.width - 10, 180, 10, 140);
}

// --- حلقة اللعبة الأساسية (Game Loop) ---
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawPitch();

    // تحديث الفيزياء والأوضاع
    player.update(keys);
    ai.update(keys);
    ball.update();

    // الرسم
    player.draw();
    ai.draw();
    ball.draw();

    requestAnimationFrame(gameLoop);
}

// تشغيل المحرك
gameLoop();
</script>

</body>
</html>
