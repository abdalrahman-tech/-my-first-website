<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة المسابقات المتقدمة</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #1e1e2f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .quiz-card {
      background: #27293d;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }
    .category-title {
      font-size: 22px;
      margin-bottom: 20px;
      color: #e14eca;
    }
    .btn-cat {
      background: #323550;
      color: #fff;
      border: 2px solid #e14eca;
      padding: 15px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .btn-cat:hover {
      background: #e14eca;
    }
    .header-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 15px;
      color: #a9a9b9;
    }
    .level-badge {
      background: #ff9f43;
      color: #fff;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 13px;
    }
    .timer {
      color: #ff4757;
      font-weight: bold;
    }
    .question-text {
      font-size: 20px;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .options-grid {
      display: grid;
      gap: 12px;
    }
    .btn-option {
      background: #323550;
      color: #fff;
      border: 2px solid transparent;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-option:hover { background: #3d4063; }
    .btn-option.correct { background: #2ed573 !important; }
    .btn-option.wrong { background: #ff4757 !important; }
    .btn-restart {
      background: #e14eca;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <!-- شاشة اختيار القسم -->
    <div id="category-box">
      <h2 class="category-title">اختر قسم المسابقة 🎯</h2>
      <button class="btn-cat" onclick="selectCategory('football')">⚽ كرة القدم</button>
      <button class="btn-cat" onclick="selectCategory('cooking')">🍳 الطبخ والطهي</button>
      <button class="btn-cat" onclick="selectCategory('general')">🧠 معلومات عامة</button>
    </div>

    <!-- شاشة الأسئلة -->
    <div id="quiz-box" style="display: none;">
      <div class="header-info">
        <span id="progress">السؤال 1</span>
        <span id="level-text" class="level-badge">المستوى 1</span>
        <span class="timer">الوقت: <span id="time-left">15</span>s</span>
      </div>
      <div class="question-text" id="question">جاري تحميل السؤال...</div>
      <div class="options-grid" id="options"></div>
    </div>

    <!-- شاشة النتيجة -->
    <div id="result-box" style="display: none;">
      <h2>🎉 انتهت اللعبة!</h2>
      <p id="score-text" style="font-size: 22px; margin: 20px 0;"></p>
      <button class="btn-restart" onclick="goHome()">الرئيسية 🏠</button>
    </div>
  </div>

  <script>
    let allQuestions = [];
    let selectedQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let timer;
    let timeLeft = 15;

    fetch('questions.json')
      .then(res => res.json())
      .then(data => { allQuestions = data; })
      .catch(() => alert('تأكد من وجود ملف questions.json'));

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function selectCategory(cat) {
      // تصفية الأسئلة حسب القسم
      let filtered = allQuestions.filter(q => q.category === cat);
      if (filtered.length === 0) {
        alert('لا توجد أسئلة في هذا القسم بعد!');
        return;
      }

      // ترتيب الأسئلة حسب الصعوبة (من 1 إلى 3) مع خلط الأسئلة داخل كل مستوى صعوبة
      filtered.sort((a, b) => a.level - b.level);
      selectedQuestions = filtered;

      score = 0;
      currentIndex = 0;
      document.getElementById('category-box').style.display = 'none';
      document.getElementById('quiz-box').style.display = 'block';
      showQuestion();
    }

    function showQuestion() {
      clearInterval(timer);
      timeLeft = 15;
      document.getElementById('time-left').innerText = timeLeft;

      let qData = selectedQuestions[currentIndex];
      document.getElementById('progress').innerText = `السؤال ${currentIndex + 1} من ${selectedQuestions.length}`;
      document.getElementById('level-text').innerText = `المستوى ${qData.level || 1}`;
      document.getElementById('question').innerText = qData.q;

      let optionsContainer = document.getElementById('options');
      optionsContainer.innerHTML = '';

      let formattedOptions = qData.o.map((opt, index) => {
        return { text: opt, isCorrect: index === qData.c };
      });
      formattedOptions = shuffle(formattedOptions);

      formattedOptions.forEach(opt => {
        let btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(btn, opt.isCorrect);
        optionsContainer.appendChild(btn);
      });

      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          nextQuestion();
        }
      }, 1000);
    }

    function selectOption(selectedBtn, isCorrect) {
      clearInterval(timer);
      let buttons = document.querySelectorAll('.btn-option');
      buttons.forEach(b => b.disabled = true);

      if (isCorrect) {
        selectedBtn.classList.add('correct');
        score++;
      } else {
        selectedBtn.classList.add('wrong');
      }

      setTimeout(() => {
        nextQuestion();
      }, 1200);
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < selectedQuestions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-box').style.display = 'none';
      document.getElementById('result-box').style.display = 'block';
      document.getElementById('score-text').innerText = `جبت ${score} من ${selectedQuestions.length}`;
    }

    function goHome() {
      document.getElementById('result-box').style.display = 'none';
      document.getElementById('category-box').style.display = 'block';
    }
  </script>
</body>
</html>
