<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة الأسئلة والمسابقات</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --correct: #22c55e;
      --wrong: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }

    .stats-item {
      font-size: 0.9rem;
      background: #334155;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .grid-cats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .cat-btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .levels-map {
      display: flex;
      flex-direction: column-reverse;
      gap: 12px;
      align-items: center;
      margin: 20px 0;
    }

    .level-node {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .level-node.completed { background: var(--correct); }
    .level-node.current { background: var(--primary); border: 3px solid #fff; }
    .level-node.locked { opacity: 0.5; cursor: not-allowed; }

    .quiz-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .question-box {
      font-size: 1.2rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .answer-btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      text-align: right;
    }

    .answer-btn.correct { background: var(--correct); }
    .answer-btn.wrong { background: var(--wrong); }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .modal-card h3 { margin-bottom: 10px; }
    .modal-card p { margin-bottom: 20px; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="stats-item">القسم: <span id="current-cat-name">الرئيسية</span></div>
      <div class="stats-item">🔑 <span id="keys-count">0</span></div>
      <div class="stats-item">❌ <span id="wrong-count">0/5</span></div>
    </header>

    <!-- شاشة اختيار القسم -->
    <div id="category-view">
      <h2>اختر القسم:</h2>
      <div class="grid-cats">
        <button class="cat-btn" onclick="selectCategory('sports')">⚽ رياضة</button>
        <button class="cat-btn" onclick="selectCategory('movies')">🎬 أفلام</button>
        <button class="cat-btn" onclick="selectCategory('general')">🌍 عامة</button>
        <button class="cat-btn" onclick="selectCategory('cooking')">🍳 طبخ</button>
        <button class="cat-btn" onclick="selectCategory('science')">🧪 علوم</button>
      </div>
    </div>

    <!-- شاشة الخريطة -->
    <div id="map-view" style="display: none;">
      <h2>خريطة المستويات</h2>
      <div id="levels-map" class="levels-map"></div>
      <button class="btn" onclick="showView('category-view')">تغيير القسم</button>
    </div>

    <!-- شاشة اللعب -->
    <div id="quiz-view" style="display: none;">
      <div class="quiz-info">
        <span id="level-indicator">المستوى 1 / 5</span>
        <span id="progress-indicator">التقدم: 0 / 7</span>
      </div>
      <div id="question-text" class="question-box">السؤال يظهر هنا...</div>
      <div id="options-container" class="options-container"></div>
      
      <button class="btn" style="margin-top: 15px; background: #d97706;" onclick="useKeyToSkip()">تخطي بمفتاح 🔑</button>
      <button class="btn" style="background: #475569;" onclick="showView('map-view')">الانسحاب للتقسيم</button>
    </div>
  </div>

  <!-- النافذة المنبثقة للرسائل -->
  <div id="custom-modal" class="modal-overlay">
    <div class="modal-card">
      <h3 id="modal-title">تنبيه</h3>
      <p id="modal-msg">نص الرسالة هنا...</p>
      <button class="btn" onclick="closeModal()">موافق</button>
    </div>
  </div>

  <script>
    const TOTAL_LEVELS = 5;
    const QUESTIONS_TO_PASS = 7; // عدد الأسئلة المطلوب إجابتها بنجاح للعبور

    let questionBank = {};
    let currentLevelPool = []; // بنك أسئلة المستوى الحالي فقط
    let currentPoolIndex = 0;

    async function loadQuestions() {
      try {
        const response = await fetch('questions.json');
        questionBank = await response.json();
      } catch (e) {
        console.error("لم يتم تحميل ملف الأسئلة:", e);
      }
    }
    loadQuestions();

    let keys = parseInt(localStorage.getItem('user_keys')) || 0;
    let progress = JSON.parse(localStorage.getItem('user_progress')) || {
      sports: 1, movies: 1, general: 1, cooking: 1, science: 1
    };

    let currentCategory = '';
    let currentLevel = 1;
    let correctInThisLevel = 0; // عدد الأسئلة الصحيحة في المستوى الحالي
    let wrongAnswersCount = 0;
    let currentQuestionData = null;

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playAudio(type) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, audioCtx.currentTime);
          osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        }
      } catch (e) {}
    }

    function showView(viewId) {
      document.getElementById('category-view').style.display = 'none';
      document.getElementById('map-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById(viewId).style.display = 'block';
      updateHeader();
    }

    function updateHeader() {
      document.getElementById('keys-count').innerText = keys;
      document.getElementById('wrong-count').innerText = `${wrongAnswersCount}/5`;
      const names = { sports:'رياضة', movies:'أفلام', general:'عامة', cooking:'طبخ', science:'علوم' };
      document.getElementById('current-cat-name').innerText = names[currentCategory] || 'الرئيسية';
    }

    function selectCategory(cat) {
      initAudio();
      currentCategory = cat;
      renderMap();
      showView('map-view');
    }

    function renderMap() {
      const mapContainer = document.getElementById('levels-map');
      mapContainer.innerHTML = '';
      const unlockedLevel = progress[currentCategory] || 1;

      for (let i = 1; i <= TOTAL_LEVELS; i++) {
        const node = document.createElement('div');
        node.className = 'level-node';
        if (i < unlockedLevel) {
          node.classList.add('completed');
          node.innerText = '✓';
          node.onclick = () => startQuiz(i);
        } else if (i === unlockedLevel) {
          node.classList.add('current');
          node.innerText = i;
          node.onclick = () => startQuiz(i);
        } else {
          node.classList.add('locked');
          node.innerText = '🔒';
        }
        mapContainer.appendChild(node);
      }
    }

    function startQuiz(level) {
      initAudio();
      currentLevel = level;
      correctInThisLevel = 0;
      wrongAnswersCount = 0;
      currentPoolIndex = 0;

      // جلب أسئلة هذا المستوى تحديداً وخضّها عشوائياً
      const levelKey = `level_${level}`;
      if (questionBank[currentCategory] && questionBank[currentCategory][levelKey]) {
        currentLevelPool = [...questionBank[currentCategory][levelKey]].sort(() => Math.random() - 0.5);
      } else {
        currentLevelPool = [{ q: "سؤال تجريبي", options: ["1", "2", "3", "4"], correct: "1" }];
      }

      showView('quiz-view');
      loadNextQuestion();
    }

    function loadNextQuestion() {
      // إذا أنجز 7 إجابات صحيحة ينتهي المستوى بنجاح
      if (correctInThisLevel >= QUESTIONS_TO_PASS) {
        completeLevel();
        return;
      }

      // إذاخلصت أسئلة المستوى والاحتياطي قبل الوصول لـ 7
      if (currentPoolIndex >= currentLevelPool.length) {
        showModal("انتهت أسئلة المستوى! ⚠️", "لم تتجاوز 7 أسئلة صحيحة، سيتم إعادة المستوى.");
        startQuiz(currentLevel);
        return;
      }

      document.getElementById('level-indicator').innerText = `المستوى ${currentLevel} / ${TOTAL_LEVELS}`;
      document.getElementById('progress-indicator').innerText = `التقدم: ${correctInThisLevel} / ${QUESTIONS_TO_PASS}`;
      updateHeader();

      currentQuestionData = currentLevelPool[currentPoolIndex];

      document.getElementById('question-text').innerText = currentQuestionData.q;
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      let shuffledOptions = [...currentQuestionData.options].sort(() => Math.random() - 0.5);

      shuffledOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(btn, opt, currentQuestionData.correct);
        container.appendChild(btn);
      });
    }

    function checkAnswer(btn, selected, correct) {
      initAudio();
      const btns = document.querySelectorAll('.answer-btn');
      btns.forEach(b => b.disabled = true);

      if (selected === correct) {
        btn.classList.add('correct');
        playAudio('correct');
        correctInThisLevel++;
        currentPoolIndex++; // الانتقال للسؤال التالي
        setTimeout(() => {
          loadNextQuestion();
        }, 500);
      } else {
        btn.classList.add('wrong');
        playAudio('wrong');
        wrongAnswersCount++;
        currentPoolIndex++; // استبدال السؤال بالسؤال الاحتياطي التالي في القائمة!
        updateHeader();

        setTimeout(() => {
          if (wrongAnswersCount >= 5) {
            showModal("خسرت في هذا المستوى! ⚠️", "وصلت لـ 5 أخطاء. إعادة المستوى من البداية!");
            startQuiz(currentLevel);
          } else {
            showModal("إجابة خاطئة! ❌", "تم استبدال السؤال بسؤال جديد من دكة احتياط هذا المستوى!");
            loadNextQuestion();
          }
        }, 500);
      }
    }

    function useKeyToSkip() {
      initAudio();
      if (keys > 0) {
        keys--;
        localStorage.setItem('user_keys', keys);
        playAudio('correct');
        correctInThisLevel++;
        currentPoolIndex++;
        loadNextQuestion();
      } else {
        showModal("لا يوجد مفاتيح! 🔑", "تحصل على مفتاح بعد إكمال المستويات.");
      }
    }

    function completeLevel() {
      if (currentLevel === progress[currentCategory]) {
        progress[currentCategory]++;
        localStorage.setItem('user_progress', JSON.stringify(progress));

        keys++;
        localStorage.setItem('user_keys', keys);
        showModal("مبروك يا بطل! 🎉", `أتممت المستوى ${currentLevel} بنجاح وفزت بمفتاح مجاني 🔑!`);
      } else {
        showModal("ممتاز جداً! 👏", `أتممت المستوى ${currentLevel} بنجاح!`);
      }
      renderMap();
      showView('map-view');
    }

    function showModal(title, msg) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-msg').innerText = msg;
      document.getElementById('custom-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('custom-modal').style.display = 'none';
    }

    updateHeader();
  </script>
</body>
</html>
