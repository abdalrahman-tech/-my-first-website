<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة المسابقات المتقدمة</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #1e1e2f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .quiz-card {
      background: #27293d;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }
    .category-title {
      font-size: 22px;
      margin-bottom: 20px;
      color: #e14eca;
    }
    .btn-cat {
      background: #323550;
      color: #fff;
      border: 2px solid #e14eca;
      padding: 15px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 12px;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-cat:hover {
      background: #e14eca;
    }
    .high-score-tag {
      font-size: 13px;
      background: rgba(255,255,255,0.2);
      padding: 3px 8px;
      border-radius: 5px;
    }
    .header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 15px;
      color: #a9a9b9;
    }
    .level-badge {
      background: #ff9f43;
      color: #fff;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 13px;
    }
    .timer {
      color: #ff4757;
      font-weight: bold;
    }
    .question-text {
      font-size: 20px;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .options-grid {
      display: grid;
      gap: 12px;
    }
    .btn-option {
      background: #323550;
      color: #fff;
      border: 2px solid transparent;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-option:hover { background: #3d4063; }
    .btn-option.correct { background: #2ed573 !important; }
    .btn-option.wrong { background: #ff4757 !important; }
    .result-badge {
      font-size: 18px;
      color: #2ed573;
      margin: 10px 0;
    }
    .btn-restart {
      background: #e14eca;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <!-- شاشة اختيار القسم -->
    <div id="category-box">
      <h2 class="category-title">اختر قسم المسابقة 🎯</h2>
      <button class="btn-cat" onclick="selectCategory('football')">
        <span>⚽ كرة القدم</span>
        <span class="high-score-tag" id="hs-football">أعلى سكور: 0</span>
      </button>
      <button class="btn-cat" onclick="selectCategory('cooking')">
        <span>🍳 الطبخ والطهي</span>
        <span class="high-score-tag" id="hs-cooking">أعلى سكور: 0</span>
      </button>
      <button class="btn-cat" onclick="selectCategory('general')">
        <span>🧠 معلومات عامة</span>
        <span class="high-score-tag" id="hs-general">أعلى سكور: 0</span>
      </button>
    </div>

    <!-- شاشة الأسئلة -->
    <div id="quiz-box" style="display: none;">
      <div class="header-info">
        <span id="progress">السؤال 1</span>
        <span id="level-text" class="level-badge">المستوى 1</span>
        <span class="timer">الوقت: <span id="time-left">15</span>s</span>
      </div>
      <div class="question-text" id="question">جاري تحميل السؤال...</div>
      <div class="options-grid" id="options"></div>
    </div>

    <!-- شاشة النتيجة -->
    <div id="result-box" style="display: none;">
      <h2>🎉 انتهت اللعبة!</h2>
      <p id="score-text" style="font-size: 22px; margin: 15px 0 5px 0;"></p>
      <div id="rating-text" class="result-badge"></div>
      <p id="high-score-msg" style="color: #ff9f43; font-weight: bold;"></p>
      <button class="btn-restart" onclick="goHome()">الرئيسية 🏠</button>
    </div>
  </div>

  <script>
    // روابط المؤثرات الصوتية
    const soundCorrect = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');
    const soundWrong = new Audio('https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3');
    const soundWin = new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3');
    const soundTimeout = new Audio('https://assets.mixkit.co/active_storage/sfx/2874/2874-preview.mp3');

    let allQuestions = [];
    let selectedQuestions = [];
    let currentCategory = '';
    let currentIndex = 0;
    let score = 0;
    let timer;
    let timeLeft = 15;

    // تحميل الأسئلة وتحديث أرقام أداء الأجهزة (High Scores)
    fetch('questions.json')
      .then(res => res.json())
      .then(data => { 
        allQuestions = data;
        updateHighScoreDisplay();
      })
      .catch(() => alert('تأكد من وجود ملف questions.json'));

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function updateHighScoreDisplay() {
      ['football', 'cooking', 'general'].forEach(cat => {
        let hs = localStorage.getItem('hs_' + cat) || 0;
        let el = document.getElementById('hs-' + cat);
        if(el) el.innerText = `أعلى سكور: ${hs}`;
      });
    }

    function selectCategory(cat) {
      currentCategory = cat;
      let filtered = allQuestions.filter(q => q.category === cat);
      if (filtered.length === 0) {
        alert('لا توجد أسئلة في هذا القسم بعد!');
        return;
      }

      // ترتيب الأسئلة حسب المستوى من 1 لـ 3
      filtered.sort((a, b) => (a.level || 1) - (b.level || 1));
      selectedQuestions = filtered;

      score = 0;
      currentIndex = 0;
      document.getElementById('category-box').style.display = 'none';
      document.getElementById('quiz-box').style.display = 'block';
      showQuestion();
    }

    function showQuestion() {
      clearInterval(timer);
      timeLeft = 15;
      document.getElementById('time-left').innerText = timeLeft;

      let qData = selectedQuestions[currentIndex];
      document.getElementById('progress').innerText = `السؤال ${currentIndex + 1} من ${selectedQuestions.length}`;
      document.getElementById('level-text').innerText = `المستوى ${qData.level || 1}`;
      document.getElementById('question').innerText = qData.q;

      let optionsContainer = document.getElementById('options');
      optionsContainer.innerHTML = '';

      let formattedOptions = qData.o.map((opt, index) => {
        return { text: opt, isCorrect: index === qData.c };
      });
      formattedOptions = shuffle(formattedOptions);

      formattedOptions.forEach(opt => {
        let btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(btn, opt.isCorrect);
        optionsContainer.appendChild(btn);
      });

      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          soundTimeout.play();
          nextQuestion();
        }
      }, 1000);
    }

    function selectOption(selectedBtn, isCorrect) {
      clearInterval(timer);
      let buttons = document.querySelectorAll('.btn-option');
      buttons.forEach(b => b.disabled = true);

      if (isCorrect) {
        selectedBtn.classList.add('correct');
        soundCorrect.cloneNode(true).play();
        score++;
      } else {
        selectedBtn.classList.add('wrong');
        soundWrong.cloneNode(true).play();
      }

      setTimeout(() => {
        nextQuestion();
      }, 1200);
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < selectedQuestions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-box').style.display = 'none';
      document.getElementById('result-box').style.display = 'block';
      
      let total = selectedQuestions.length;
      document.getElementById('score-text').innerText = `جبت ${score} من ${total}`;

      // تقييم الأداء
      let percentage = (score / total) * 100;
      let ratingMsg = '';
      if (percentage === 100) ratingMsg = '🌟 أداء أسطوري! ممتاز جداً';
      else if (percentage >= 70) ratingMsg = '👏 ممتاز! أداء قوي جداً';
      else if (percentage >= 50) ratingMsg = 'جيد! محتاج تدريب أكتير';
      else ratingMsg = 'حاول مرة أخرى لتطوير معلوماتك! 💪';
      
      document.getElementById('rating-text').innerText = ratingMsg;

      // حفظ أعلى سكور (High Score)
      let currentHS = localStorage.getItem('hs_' + currentCategory) || 0;
      let hsMsg = document.getElementById('high-score-msg');
      if (score > currentHS) {
        localStorage.setItem('hs_' + currentCategory, score);
        hsMsg.innerText = '🔥 رقم قياسي جديد على جهازك!';
      } else {
        hsMsg.innerText = '';
      }

      soundWin.play();
      updateHighScoreDisplay();
    }

    function goHome() {
      document.getElementById('result-box').style.display = 'none';
      document.getElementById('category-box').style.display = 'block';
    }
  </script>
</body>
</html>
