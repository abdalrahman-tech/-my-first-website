<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحدي المعرفة - خريطة المستويات</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: linear-gradient(180deg, #1A2980 0%, #26D0CE 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; color: #fff; padding: 15px; }

    /* Header Bar */
    .top-bar { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 10px 20px; border-radius: 15px; backdrop-filter: blur(5px); margin-bottom: 20px; }
    .stat-box { font-size: 1.1rem; font-weight: bold; display: flex; align-items: center; gap: 5px; }

    .container { width: 100%; max-width: 500px; background: rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 20px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); text-align: center; }

    /* Category Selection */
    .categories-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 15px; }
    .category-btn { background: #FF9800; border: none; padding: 15px; border-radius: 12px; color: #fff; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #E65100; }
    .category-btn:active { transform: translateY(4px); box-shadow: none; }

    /* Level Map View */
    .map-container { display: flex; flex-direction: column-reverse; align-items: center; gap: 12px; margin: 20px 0; max-height: 400px; overflow-y: auto; padding: 10px; }
    .map-row { display: flex; width: 100%; justify-content: center; }
    .level-node { width: 55px; height: 55px; border-radius: 50%; border: 3px solid #fff; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2rem; cursor: pointer; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.3s; }
    .level-node.completed { background: #4CAF50; color: #fff; }
    .level-node.current { background: #FFD700; color: #000; animation: pulse 1.5s infinite; }
    .level-node.locked { background: #607D8B; color: #9E9E9E; cursor: not-allowed; border-color: #78909C; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

    /* Quiz Area */
    .quiz-area { display: none; }
    .question-box { background: rgba(0, 0, 0, 0.2); padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 1.2rem; min-height: 80px; display: flex; align-items: center; justify-content: center; }
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .option-btn { background: #ffffff; color: #333; border: none; padding: 12px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .option-btn:hover { background: #f0f0f0; }

    /* Action Buttons */
    .action-btn { margin-top: 15px; background: #9C27B0; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #7B1FA2; }
    .back-btn { background: #f44336; box-shadow: 0 4px 0 #d32f2f; }

    /* Modal Popup */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: #fff; color: #333; padding: 25px; border-radius: 15px; text-align: center; max-width: 320px; width: 90%; }
    .modal-btn { margin-top: 15px; background: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="stat-box">🔑 المفاتيح: <span id="keys-count">0</span></div>
    <div class="stat-box">⭐ القسم: <span id="current-cat-name">اختر قسم</span></div>
  </div>

  <div class="container">
    <!-- View 1: Categories -->
    <div id="category-view">
      <h2>اختر القسم للبدء 🎯</h2>
      <div class="categories-grid">
        <button class="category-btn" onclick="selectCategory('sports')">⚽ رياضة</button>
        <button class="category-btn" onclick="selectCategory('movies')">🎬 أفلام</button>
        <button class="category-btn" onclick="selectCategory('general')">💡 معلومات عامة</button>
        <button class="category-btn" onclick="selectCategory('cooking')">🍳 طبخ</button>
        <button class="category-btn" style="grid-column: span 2;" onclick="selectCategory('science')">🔬 علوم</button>
      </div>
    </div>

    <!-- View 2: Level Map -->
    <div id="map-view" style="display: none;">
      <h2>خريطة المستويات 🗺️</h2>
      <div class="map-container" id="levels-map"></div>
      <button class="action-btn back-btn" onclick="showView('category-view')">تغيير القسم</button>
    </div>

    <!-- View 3: Quiz Screen -->
    <div id="quiz-view" class="quiz-area">
      <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
        <span id="level-indicator">المستوى 1</span>
        <span id="progress-indicator">السؤال 1 / 30</span>
      </div>
      <div class="question-box" id="question-text">جاري تحميل السؤال...</div>
      <div class="options-grid" id="options-container"></div>
      <button class="action-btn" onclick="useKeyToSkip()">استخدام مفتاح للتخطي 🔑</button>
      <br>
      <button class="action-btn back-btn" onclick="showView('map-view')">انسحاب للخريطة</button>
    </div>
  </div>

  <!-- Custom Notification Modal -->
  <div class="modal" id="custom-modal">
    <div class="modal-content">
      <h3 id="modal-title">تهانينا!</h3>
      <p id="modal-msg" style="margin-top: 10px;">انتقلت للمستوى التالي</p>
      <button class="modal-btn" onclick="closeModal()">حسناً</button>
    </div>
  </div>

  <script>
    // System Data & State Management
    let keys = parseInt(localStorage.getItem('user_keys')) || 0;
    let progress = JSON.parse(localStorage.getItem('user_progress')) || {
      sports: 1, movies: 1, general: 1, cooking: 1, science: 1
    };

    let currentCategory = '';
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let questionsList = [];

    // Sound System (Built-in Web Audio API)
    function playAudio(isCorrect) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if(isCorrect) {
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
      } else {
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        osc.frequency.setValueAtTime(130.81, ctx.currentTime + 0.1);
      }
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
      osc.stop(ctx.currentTime + 0.3);
    }

    // UI View Switching
    function showView(viewId) {
      document.getElementById('category-view').style.display = 'none';
      document.getElementById('map-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById(viewId).style.display = 'block';
      updateHeader();
    }

    function updateHeader() {
      document.getElementById('keys-count').innerText = keys;
      const names = { sports:'رياضة', movies:'أفلام', general:'عامة', cooking:'طبخ', science:'علوم' };
      document.getElementById('current-cat-name').innerText = names[currentCategory] || 'اختر قسم';
    }

    // Select Category and Render Map
    function selectCategory(cat) {
      currentCategory = cat;
      renderMap();
      showView('map-view');
    }

    function renderMap() {
      const mapContainer = document.getElementById('levels-map');
      mapContainer.innerHTML = '';
      const unlockedLevel = progress[currentCategory] || 1;

      for (let i = 1; i <= 15; i++) {
        const row = document.createElement('div');
        row.className = 'map-row';
        
        const node = document.createElement('div');
        node.className = 'level-node';
        
        if (i < unlockedLevel) {
          node.classList.add('completed');
          node.innerText = i;
          node.onclick = () => startQuiz(i);
        } else if (i === unlockedLevel) {
          node.classList.add('current');
          node.innerText = i;
          node.onclick = () => startQuiz(i);
        } else {
          node.classList.add('locked');
          node.innerText = '🔒';
        }

        row.appendChild(node);
        mapContainer.appendChild(row);
      }
    }

    // Quiz Questions Generator (Dynamic Question Pool per Level)
    function generateQuestionsForLevel(category, level) {
      let list = [];
      for (let i = 1; i <= 30; i++) {
        list.push({
          q: `سؤال ${i} (مستوى ${level} - ${category}): ما هو الخيار الصحيح لهذه الإجابة؟`,
          options: ["الإجابة الصحيحة", "خيار خاطئ 1", "خيار خاطئ 2", "خيار خاطئ 3"],
          correct: "الإجابة الصحيحة"
        });
      }
      return list;
    }

    function startQuiz(level) {
      currentLevel = level;
      currentQuestionIndex = 0;
      questionsList = generateQuestionsForLevel(currentCategory, currentLevel);
      showView('quiz-view');
      loadQuestion();
    }

    function loadQuestion() {
      if (currentQuestionIndex >= 30) {
        completeLevel();
        return;
      }

      document.getElementById('level-indicator').innerText = `المستوى ${currentLevel}`;
      document.getElementById('progress-indicator').innerText = `السؤال ${currentQuestionIndex + 1} / 30`;

      const qData = questionsList[currentQuestionIndex];
      document.getElementById('question-text').innerText = qData.q;

      // Randomize / Shuffle Options
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      let shuffled = [...qData.options].sort(() => Math.random() - 0.5);

      shuffled.forEach(optionText => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optionText;
        btn.onclick = () => checkAnswer(optionText, qData.correct);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selected, correct) {
      if (selected === correct) {
        playAudio(true);
        currentQuestionIndex++;
        loadQuestion();
      } else {
        playAudio(false);
        showModal("إجابة خاطئة! ❌", "حاول مرة أخرى بتركيز أكبر.");
      }
    }

    function useKeyToSkip() {
      if (keys > 0) {
        keys--;
        localStorage.setItem('user_keys', keys);
        updateHeader();
        playAudio(true);
        currentQuestionIndex++;
        loadQuestion();
      } else {
        showModal("لا يوجد مفاتيح! 🔑", "تكسب مفتاحاً جديداً بعد إكمال كل 3 مستويات.");
      }
    }

    function completeLevel() {
      if (currentLevel === progress[currentCategory]) {
        progress[currentCategory]++;
        // Reward key every 3 levels
        if (currentLevel % 3 === 0) {
          keys++;
          localStorage.setItem('user_keys', keys);
          showModal("مبروك! 🎉", `أتممت المستوى ${currentLevel} وحصلت على مفتاح مجاني 🔑!`);
        } else {
          showModal("ممتاز! 👏", `أتممت المستوى ${currentLevel} بنجاح!`);
        }
        localStorage.setItem('user_progress', JSON.stringify(progress));
      }
      renderMap();
      showView('map-view');
    }

    // Modal Helpers
    function showModal(title, msg) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-msg').innerText = msg;
      document.getElementById('custom-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('custom-modal').style.display = 'none';
    }

    // Initialize Page
    updateHeader();
  </script>
</body>
</html>
