<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحدي المعرفة - Game UI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; user-select: none; }
    
    body {
      background: linear-gradient(135deg, #1b153a 0%, #2b1055 50%, #7597de 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
      padding: 15px;
    }

    /* Top Game Bar */
    .top-bar {
      width: 100%;
      max-width: 450px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px 20px;
      border-radius: 20px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      margin-bottom: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .stat-badge {
      background: linear-gradient(180deg, #ff9d00 0%, #ff6c00 100%);
      padding: 6px 16px;
      border-radius: 50px;
      font-weight: 900;
      font-size: 1rem;
      box-shadow: 0 4px 0 #b34b00, inset 0 2px 0 rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: rgba(20, 18, 41, 0.75);
      border-radius: 28px;
      padding: 20px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .game-title {
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 20px;
      color: #00f2fe;
      text-shadow: 0 0 10px rgba(0,242,254,0.5);
    }

    /* Vertical Category List (تحت بعضها) */
    .categories-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn-3d {
      width: 100%;
      border: none;
      padding: 16px;
      border-radius: 18px;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      position: relative;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-shadow: 1px 2px 3px rgba(0,0,0,0.4);
    }

    .btn-3d:active {
      transform: translateY(4px);
      box-shadow: none !important;
    }

    /* Distinct Gamer Colors */
    .btn-sports  { background: linear-gradient(180deg, #ff416c 0%, #ff4b2b 100%); box-shadow: 0 6px 0 #b31217; }
    .btn-movies  { background: linear-gradient(180deg, #8a2387 0%, #e94057 100%); box-shadow: 0 6px 0 #591054; }
    .btn-general { background: linear-gradient(180deg, #f7b731 0%, #fa8231 100%); box-shadow: 0 6px 0 #ab4f19; }
    .btn-cooking { background: linear-gradient(180deg, #26de81 0%, #2bcbba 100%); box-shadow: 0 6px 0 #158a50; }
    .btn-science { background: linear-gradient(180deg, #00c6ff 0%, #0072ff 100%); box-shadow: 0 6px 0 #0044a3; }

    /* Map Layout */
    .map-container {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 15px;
      max-height: 380px;
      overflow-y: auto;
      padding: 15px 5px;
    }

    .level-node {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 900;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,0.4);
      transition: 0.2s;
    }

    .level-node.completed { background: linear-gradient(180deg, #11998e 0%, #38ef7d 100%); border: 3px solid #fff; }
    .level-node.current   { background: linear-gradient(180deg, #f857a6 0%, #ff5858 100%); border: 3px solid #fff; animation: bounce 1.2s infinite alternate; }
    .level-node.locked    { background: #4a4e69; color: #8d99ae; cursor: not-allowed; border: 3px solid #2b2d42; box-shadow: none; }

    @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }

    /* Quiz Game Area */
    .question-card {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 20px;
      font-size: 1.25rem;
      font-weight: bold;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
    }

    .answers-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .answer-btn {
      background: #ffffff;
      color: #1a1a2e;
      border: none;
      padding: 15px;
      border-radius: 15px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #cbd5e1;
      transition: 0.15s;
    }

    .answer-btn:active { transform: translateY(3px); box-shadow: none; }
    .answer-btn.correct { background: #2ecc71 !important; color: #fff; box-shadow: 0 5px 0 #27ae60 !important; }
    .answer-btn.wrong   { background: #e74c3c !important; color: #fff; box-shadow: 0 5px 0 #c0392b !important; }

    .action-btn {
      margin-top: 15px;
      background: #8e44ad;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #6c3483;
    }
    .back-btn { background: #e74c3c; box-shadow: 0 4px 0 #c0392b; }

    /* Custom Gamer Popup */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
    .modal-content { background: #22254a; border: 3px solid #ff9d00; color: #fff; padding: 25px; border-radius: 22px; text-align: center; max-width: 320px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .modal-btn { margin-top: 15px; background: #2ecc71; color: white; border: none; padding: 10px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #27ae60; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="stat-badge">🔑 المفاتيح: <span id="keys-count">0</span></div>
    <div class="stat-badge" style="background: linear-gradient(180deg, #00c6ff 0%, #0072ff 100%); box-shadow: 0 4px 0 #0044a3;">🎯 <span id="current-cat-name">الرئيسية</span></div>
  </div>

  <div class="container">
    <!-- View 1: Categories (تحت بعضها وبشكل العاب) -->
    <div id="category-view">
      <div class="game-title">اختر القسم للبدء 🎮</div>
      <div class="categories-list">
        <button class="btn-3d btn-sports" onclick="selectCategory('sports')">⚽ قسم الرياضة</button>
        <button class="btn-3d btn-movies" onclick="selectCategory('movies')">🎬 قسم الأفلام</button>
        <button class="btn-3d btn-general" onclick="selectCategory('general')">💡 معلومات عامة</button>
        <button class="btn-3d btn-cooking" onclick="selectCategory('cooking')">🍳 قسم الطبخ</button>
        <button class="btn-3d btn-science" onclick="selectCategory('science')">🔬 قسم العلوم</button>
      </div>
    </div>

    <!-- View 2: Level Map -->
    <div id="map-view" style="display: none;">
      <div class="game-title">خريطة المستويات 🗺️</div>
      <div class="map-container" id="levels-map"></div>
      <button class="action-btn back-btn" onclick="showView('category-view')">تغيير القسم</button>
    </div>

    <!-- View 3: Quiz Screen -->
    <div id="quiz-view" style="display: none;">
      <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: bold;">
        <span id="level-indicator" style="color: #ff9d00;">المستوى 1</span>
        <span id="progress-indicator" style="color: #00f2fe;">السؤال 1 / 30</span>
      </div>
      <div class="question-card" id="question-text">جاري تحميل السؤال...</div>
      <div class="answers-list" id="options-container"></div>
      
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button class="action-btn" onclick="useKeyToSkip()">تخطي بمفتاح 🔑</button>
        <button class="action-btn back-btn" onclick="showView('map-view')">الانسحاب 🚪</button>
      </div>
    </div>
  </div>

  <!-- Custom Gamer Modal -->
  <div class="modal" id="custom-modal">
    <div class="modal-content">
      <h3 id="modal-title" style="font-size: 1.5rem; color: #ff9d00;">نتيجة</h3>
      <p id="modal-msg" style="margin-top: 10px; font-size: 1.1rem;">الرسالة هنا</p>
      <button class="modal-btn" onclick="closeModal()">استمرار 🚀</button>
    </div>
  </div>

  <script>
    // Real Questions Database (أسئلة حقيقية ومتنوعة)
    const questionBank = {
      sports: [
        { q: "كم عدد لاعبين فريق كرة القدم داخل الملعب؟", options: ["11 لاعب", "9 لاعبين", "10 لاعبين", "12 لاعب"], correct: "11 لاعب" },
        { q: "ما هي الدولة الفائزة بكأس العالم 2022؟", options: ["الأرجنتين", "فرنسا", "البرازيل", "إسبانيا"], correct: "الأرجنتين" },
        { q: "كم مدة شوط مباراة كرة القدم الأصلي؟", options: ["45 دقيقة", "30 دقيقة", "60 دقيقة", "40 دقيقة"], correct: "45 دقيقة" }
      ],
      movies: [
        { q: "ما هو اسم شخصية باتمان الحقيقية؟", options: ["بروس واين", "توني ستارك", "بيتر باركر", "كلارك كينت"], correct: "بروس واين" },
        { q: "ما هي لغة فيلم 'Titanic' الأصلية؟", options: ["الإنكليزية", "الفرنسية", "الإيطالية", "الإسبانية"], correct: "الإنكليزية" }
      ],
      general: [
        { q: "ما هي عاصمة جمهورية مصر العربية؟", options: ["القاهرة", "الأسكندرية", "الجيزة", "أسوان"], correct: "القاهرة" },
        { q: "كم عدد قارات العالم؟", options: ["7 قارات", "5 قارات", "6 قارات", "8 قارات"], correct: "7 قارات" }
      ],
      cooking: [
        { q: "ما هو المكون الرئيسي في طبق الكشري؟", options: ["الأرز والمكرونة", "اللحمة", "الدجاج", "السمك"], correct: "الأرز والمكرونة" },
        { q: "ما المادة التي تجعل العجين يرتفع؟", options: ["الخميرة", "النشا", "الملح", "السكر"], correct: "الخميرة" }
      ],
      science: [
        { q: "ما هو الرمز الكيميائي للماء؟", options: ["H2O", "CO2", "O2", "NaCl"], correct: "H2O" },
        { q: "ما هو أقرب كوكب إلى الشمس؟", options: ["عطارد", "الزهرة", "الأرض", "المريخ"], correct: "عطارد" }
      ]
    };

    let keys = parseInt(localStorage.getItem('user_keys')) || 0;
    let progress = JSON.parse(localStorage.getItem('user_progress')) || {
      sports: 1, movies: 1, general: 1, cooking: 1, science: 1
    };

    let currentCategory = '';
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let currentQuestions = [];

    // Audio FX System
    function playAudio(isCorrect) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if(isCorrect) {
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
      } else {
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        osc.frequency.setValueAtTime(120, ctx.currentTime + 0.1);
      }
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
      osc.stop(ctx.currentTime + 0.3);
    }

    function showView(viewId) {
      document.getElementById('category-view').style.display = 'none';
      document.getElementById('map-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById(viewId).style.display = 'block';
      updateHeader();
    }

    function updateHeader() {
      document.getElementById('keys-count').innerText = keys;
      const names = { sports:'رياضة', movies:'أفلام', general:'عامة', cooking:'طبخ', science:'علوم' };
      document.getElementById('current-cat-name').innerText = names[currentCategory] || 'الرئيسية';
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderMap();
      showView('map-view');
    }

    function renderMap() {
      const mapContainer = document.getElementById('levels-map');
      mapContainer.innerHTML = '';
      const unlockedLevel = progress[currentCategory] || 1;

      for (let i = 1; i <= 15; i++) {
        const node = document.createElement('div');
        node.className = 'level-node';
        
        if (i < unlockedLevel) {
          node.classList.add('completed');
          node.innerText = '✓';
          node.onclick = () => startQuiz(i);
        } else if (i === unlockedLevel) {
          node.classList.add('current');
          node.innerText = i;
          node.onclick = () => startQuiz(i);
        } else {
          node.classList.add('locked');
          node.innerText = '🔒';
        }
        mapContainer.appendChild(node);
      }
    }

    function startQuiz(level) {
      currentLevel = level;
      currentQuestionIndex = 0;
      
      // Get base questions and create 30 dynamic questions for level
      const base = questionBank[currentCategory] || questionBank.general;
      currentQuestions = [];
      for(let i = 0; i < 30; i++) {
        let template = base[i % base.length];
        currentQuestions.push({
          q: `[سؤال ${i+1}] ${template.q}`,
          options: template.options,
          correct: template.correct
        });
      }

      showView('quiz-view');
      loadQuestion();
    }

    function loadQuestion() {
      if (currentQuestionIndex >= 30) {
        completeLevel();
        return;
      }

      document.getElementById('level-indicator').innerText = `المستوى ${currentLevel}`;
      document.getElementById('progress-indicator').innerText = `السؤال ${currentQuestionIndex + 1} / 30`;

      const qData = currentQuestions[currentQuestionIndex];
      document.getElementById('question-text').innerText = qData.q;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      // Shuffle Answers
      let shuffled = [...qData.options].sort(() => Math.random() - 0.5);

      shuffled.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerText = opt;
        btn.onclick = (e) => checkAnswer(btn, opt, qData.correct);
        container.appendChild(btn);
      });
    }

    function checkAnswer(btn, selected, correct) {
      const btns = document.querySelectorAll('.answer-btn');
      btns.forEach(b => b.disabled = true);

      if (selected === correct) {
        btn.classList.add('correct');
        playAudio(true);
        setTimeout(() => {
          currentQuestionIndex++;
          loadQuestion();
        }, 600);
      } else {
        btn.classList.add('wrong');
        playAudio(false);
        setTimeout(() => {
          showModal("إجابة خاطئة! ❌", "حاول مرة أخرى بتركيز أكبر.");
          btns.forEach(b => b.disabled = false);
          btn.classList.remove('wrong');
        }, 600);
      }
    }

    function useKeyToSkip() {
      if (keys > 0) {
        keys--;
        localStorage.setItem('user_keys', keys);
        updateHeader();
        playAudio(true);
        currentQuestionIndex++;
        loadQuestion();
      } else {
        showModal("لا يوجد مفاتيح! 🔑", "تحصل على مفتاح مجاني بعد إنهاء كل 3 مستويات.");
      }
    }

    function completeLevel() {
      if (currentLevel === progress[currentCategory]) {
        progress[currentCategory]++;
        if (currentLevel % 3 === 0) {
          keys++;
          localStorage.setItem('user_keys', keys);
          showModal("مبروك يا بطل! 🎉", `أتممت المستوى ${currentLevel} وفزت بمفتاح مجاني 🔑!`);
        } else {
          showModal("ممتاز جداً! 👏", `أتممت المستوى ${currentLevel} بنجاح!`);
        }
        localStorage.setItem('user_progress', JSON.stringify(progress));
      }
      renderMap();
      showView('map-view');
    }

    function showModal(title, msg) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-msg').innerText = msg;
      document.getElementById('custom-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('custom-modal').style.display = 'none';
    }

    updateHeader();
  </script>
</body>
</html>
