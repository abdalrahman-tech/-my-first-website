<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة البقاء في المحيط ثلاثية الأبعاد - 3D Ocean Raft Survival</title>
    
    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: 'Tajawal', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030a16;
            color: #ffffff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Glassmorphism UI Style */
        .glass-panel {
            background: rgba(10, 25, 47, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 242, 254, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .glass-btn {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(79, 172, 254, 0.4));
            border: 1px solid rgba(0, 242, 254, 0.5);
            backdrop-filter: blur(8px);
            transition: all 0.15s ease-in-out;
        }

        .glass-btn:active {
            transform: scale(0.92);
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.6), rgba(79, 172, 254, 0.8));
        }

        /* Animated Progress Bars */
        .progress-fill {
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Custom Scrollbar for Inventory */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 242, 254, 0.4);
            border-radius: 4px;
        }

        .floating-text {
            animation: floatUp 1.2s ease-out forwards;
            position: absolute;
            pointer-events: none;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
            z-index: 50;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
        }
    </style>
</head>
<body class="select-none overflow-hidden bg-slate-950 text-white">

<!-- 3D Canvas Container -->
<div id="canvas-container"></div>

<!-- HUD Interface Layer -->
<div id="ui-layer" class="relative z-10 w-full h-full pointer-events-none flex flex-col justify-between p-4 md:p-6">
    
    <!-- Top Bar: Stats & Inventory -->
    <div class="flex flex-col md:flex-row justify-between items-start gap-4 w-full">
        
        <!-- Left Side: Player Status Bars -->
        <div class="glass-panel rounded-2xl p-4 w-72 pointer-events-auto flex flex-col gap-2.5">
            <div class="flex items-center justify-between text-xs font-bold mb-1 border-b border-cyan-500/20 pb-1">

                <span id="day-night-indicator" class="text-amber-400"><i class="fa-solid fa-sun ml-1"></i> النهار</span>
            </div>

            <!-- Health Bar -->

            </div>

            <!-- Hunger Bar -->
            <div>
                <div class="flex justify-between text-xs font-bold mb-1">

                </div>
                <div class="w-full bg-slate-900/80 rounded-full h-2.5 overflow-hidden border border-amber-500/30">

            <div class="flex items-center gap-2 bg-slate-900/60 px-3 py-1.5 rounded-xl border border-sky-800/40">
                <i class="fa-solid fa-bottle-water text-sky-400 text-lg"></i>
                <div class="text-right">
                    <div class="text-[10px] text-gray-400">ماء</div>

                </div>
            </div>

            <div class="flex items-center gap-2 bg-slate-900/60 px-3 py-1.5 rounded-xl border border-slate-700">
                <i class="fa-solid fa-cubes-stacked text-slate-400 text-lg"></i>
                <div class="text-right">
                    <div class="text-[10px] text-gray-400">خردة</div>
                    <div id="inv-scrap" class="font-bold text-sm text-slate-200">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification / Warning Center -->
    <div class="w-full flex justify-center pointer-events-none">
        <div id="warning-toast" class="opacity-0 transition-opacity duration-300 glass-panel border-red-500 text-red-400 px-6 py-2 rounded-full font-bold text-sm flex items-center gap-2">

    <!-- Bottom Controls Section -->
    <div class="flex justify-between items-end w-full pb-2">
        
        <!-- Virtual Movement Joystick / Buttons -->

<!-- Game Over Modal -->
<div id="game-over-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md hidden flex-col items-center justify-center p-6 text-center">

            <i class="fa-solid fa-rotate-right ml-2"></i> المحاولة مجدداً

<script>
/* Audio Synthesizer Class (Standalone - No External Audio Files) */
class SoundEffects {
    constructor() {
        this.ctx = null;
    }

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playCollect() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.15); // A5
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
    }

    playEat() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(320, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
    }

    playDrink() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    }

    playSharkAttack() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.4);
    }

    playRepair() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.setValueAtTime(450, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
    }
}

const sfx = new SoundEffects();
</script>

<script>
// Global Game State
const state = {
    health: 100,
    hunger: 100,
    thirst: 100,
    raftDurability: 100,
    wood: 5,
    food: 3,
    water: 3,
    scrap: 2,
    timeSurvived: 0,
    totalCollected: 0,
    gameOver: false,
    dayTime: 0 // 0 to 1 cycle
};

// Movement Controls
const move = { forward: 0, right: 0 };

// 3D Scene Variables
let scene, camera, renderer;
let oceanMesh, raftGroup, sharkGroup;
let sunLight, ambientLight;
let itemsInSea = [];
let particleSystem;
const clock = new THREE.Clock();

// Initialize Three.js Engine
function initEngine() {
    const container = document.getElementById('canvas-container');

    // Scene
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a192f);
    scene.fog = new THREE.FogExp2(0x0a192f, 0.015);

    // Camera
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 8, 14);
    camera.lookAt(0, 0, 0);

    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Lights
    ambientLight = new THREE.AmbientLight(0x7ac1ff, 0.6);
    scene.add(ambientLight);

    sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
    sunLight.position.set(30, 50, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 150;
    const d = 20;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // Create World Objects
    createOcean();
    createRaft();
    createShark();
    createParticles();

    // Resize Handler
    window.addEventListener('resize', onWindowResize);
}

// Custom Animated Water Plane
function createOcean() {
    const geo = new THREE.PlaneGeometry(300, 300, 64, 64);
    geo.rotateX(-Math.PI / 2);

    const mat = new THREE.MeshStandardMaterial({
        color: 0x006688,
        roughness: 0.1,
        metalness: 0.8,
        flatShading: true
    });

    oceanMesh = new THREE.Mesh(geo, mat);
    oceanMesh.receiveShadow = true;
    scene.add(oceanMesh);
}

// Get wave height at specific (x, z) coordinates
function getWaveHeight(x, z, time) {
    return Math.sin(x * 0.2 + time * 2) * 0.4 + Math.cos(z * 0.15 + time * 1.5) * 0.3;
}

// Procedural Wooden Raft Creation
function createRaft() {
    raftGroup = new THREE.Group();

    // Wood Logs Texture Material
    const logMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 0.8 });
    const ropeMat = new THREE.MeshStandardMaterial({ color: 0xD2B48C, roughness: 0.9 });

    // Create Raft Planks Grid (3x3 logs)
    const logGeo = new THREE.CylinderGeometry(0.35, 0.35, 5, 8);
    for (let i = -2; i <= 2; i += 1) {
        const log = new THREE.Mesh(logGeo, logMat);
        log.rotation.z = Math.PI / 2;
        log.position.z = i * 0.9;
        log.castShadow = true;
        log.receiveShadow = true;
        raftGroup.add(log);
    }

    // Cross Support Logs
    for (let i = -1.5; i <= 1.5; i += 3) {
        const crossLog = new THREE.Mesh(logGeo, logMat);
        crossLog.rotation.x = Math.PI / 2;
        crossLog.position.x = i;
        crossLog.position.y = 0.2;
        crossLog.scale.set(0.8, 0.9, 0.8);
        crossLog.castShadow = true;
        raftGroup.add(crossLog);
    }

    // Wooden Shelter Frame / Flagpole
    const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, 3, 8);
    const pole = new THREE.Mesh(poleGeo, logMat);
    pole.position.set(-1.8, 1.5, -1.8);
    pole.castShadow = true;
    raftGroup.add(pole);

    // Sail / Cloth
    const sailGeo = new THREE.BufferGeometry();
    const vertices = new Float32Array([
        -1.8, 2.8, -1.8,
        -1.8, 1.6, -1.8,
        -0.2, 2.2, -1.8
    ]);
    sailGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    sailGeo.computeVertexNormals();
    const sailMat = new THREE.MeshStandardMaterial({ color: 0xF5F5DC, side: THREE.DoubleSide });
    const sail = new THREE.Mesh(sailGeo, sailMat);
    sail.castShadow = true;
    raftGroup.add(sail);

    // Survivor Character Silhouette
    const survivorMat = new THREE.MeshStandardMaterial({ color: 0xe0a96d });
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), survivorMat);
    head.position.set(0, 1.3, 0);
    head.castShadow = true;
    raftGroup.add(head);

    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.2, 0.9, 8), new THREE.MeshStandardMaterial({ color: 0x225588 }));
    body.position.set(0, 0.65, 0);
    body.castShadow = true;
    raftGroup.add(body);

    scene.add(raftGroup);
}

// Procedural 3D Shark Creation
function createShark() {
    sharkGroup = new THREE.Group();
    const sharkMat = new THREE.MeshStandardMaterial({ color: 0x4a5568, roughness: 0.4 });

    // Shark Fin
    const finShape = new THREE.Shape();
    finShape.moveTo(0, 0);
    finShape.lineTo(0.8, 1.2);
    finShape.lineTo(1.4, 0);
    finShape.closePath();

    const extrudeSettings = { depth: 0.15, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.05, bevelThickness: 0.05 };
    const finGeo = new THREE.ExtrudeGeometry(finShape, extrudeSettings);
    const fin = new THREE.Mesh(finGeo, sharkMat);
    fin.rotation.y = Math.PI / 2;
    fin.position.set(0, -0.2, -0.6);
    fin.castShadow = true;
    sharkGroup.add(fin);

    // Body (Underwater Silhouette)
    const bodyGeo = new THREE.ConeGeometry(0.8, 3.5, 8);
    const body = new THREE.Mesh(bodyGeo, sharkMat);
    body.rotation.x = Math.PI / 2;
    body.position.set(0, -0.8, 0);
    sharkGroup.add(body);

    sharkGroup.position.set(20, 0, 20);
    scene.add(sharkGroup);
}

// Atmosphere Particles
function createParticles() {
    const count = 150;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);

    for (let i = 0; i < count * 3; i += 3) {
        pos[i] = (Math.random() - 0.5) * 80;
        pos[i + 1] = Math.random() * 15;
        pos[i + 2] = (Math.random() - 0.5) * 80;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ size: 0.15, color: 0x00ffff, transparent: true, opacity: 0.5 });
    particleSystem = new THREE.Points(geo, mat);
    scene.add(particleSystem);
}

// Spawn Floating Collectibles in Sea
function spawnSeaItem() {
    if (itemsInSea.length > 12 || state.gameOver) return;

    const types = ['wood', 'food', 'water', 'scrap'];
    const type = types[Math.floor(Math.random() * types.length)];

    const itemGroup = new THREE.Group();
    let mat, geo;

    if (type === 'wood') {
        // Crate
        geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        mat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.7 });
    } else if (type === 'water') {
        // Water Jug
        geo = new THREE.CylinderGeometry(0.3, 0.3, 0.8, 12);
        mat = new THREE.MeshStandardMaterial({ color: 0x00bfff, roughness: 0.2, transparent: true, opacity: 0.8 });
    } else if (type === 'food') {
        // Barrel
        geo = new THREE.CylinderGeometry(0.4, 0.4, 0.9, 12);
        mat = new THREE.MeshStandardMaterial({ color: 0xa52a2a, roughness: 0.6 });
    } else {
        // Scrap Metal
        geo = new THREE.DodecahedronGeometry(0.4);
        mat = new THREE.MeshStandardMaterial({ color: 0x708090, metalness: 0.9, roughness: 0.3 });
    }

    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    itemGroup.add(mesh);

    // Random Angle Spawn around player
    const angle = Math.random() * Math.PI * 2;
    const distance = 25 + Math.random() * 15;
    itemGroup.position.x = raftGroup.position.x + Math.cos(angle) * distance;
    itemGroup.position.z = raftGroup.position.z + Math.sin(angle) * distance;

    itemGroup.userData = {
        type: type,
        spawnTime: clock.getElapsedTime(),
        driftSpeed: 0.03 + Math.random() * 0.02
    };

    scene.add(itemGroup);
    itemsInSea.push(itemGroup);
}

// User Actions & Inputs
function setupInputs() {
    // Buttons Touch & Mouse Listeners
    const bindBtn = (id, onStart, onEnd) => {
        const el = document.getElementById(id);
        if (!el) return;
        
        const start = (e) => {
            e.preventDefault();
            sfx.init();
            onStart();
        };
        const end = (e) => {
            e.preventDefault();
            if (onEnd) onEnd();
        };

        el.addEventListener('touchstart', start);
        el.addEventListener('touchend', end);
        el.addEventListener('mousedown', start);
        el.addEventListener('mouseup', end);
    };

    bindBtn('btn-up', () => move.forward = 1, () => move.forward = 0);
    bindBtn('btn-down', () => move.forward = -1, () => move.forward = 0);
    bindBtn('btn-left', () => move.right = -1, () => move.right = 0);
    bindBtn('btn-right', () => move.right = 1, () => move.right = 0);

    // Keyboard Navigation
    window.addEventListener('keydown', (e) => {
        sfx.init();
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') move.forward = 1;
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') move.forward = -1;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') move.right = -1;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') move.right = 1;
    });

    window.addEventListener('keyup', (e) => {
        if (['ArrowUp', 'w', 'W', 'ArrowDown', 's', 'S'].includes(e.key)) move.forward = 0;
        if (['ArrowLeft', 'a', 'A', 'ArrowRight', 'd', 'D'].includes(e.key)) move.right = 0;
    });

    // Action Buttons
    document.getElementById('btn-hook').addEventListener('click', useHook);
    document.getElementById('btn-eat').addEventListener('click', eatFood);
    document.getElementById('btn-drink').addEventListener('click', drinkWater);
    document.getElementById('btn-repair').addEventListener('click', repairRaft);
    document.getElementById('btn-restart').addEventListener('click', restartGame);
}

// Hook Action: Grab nearby items
function useHook() {
    if (state.gameOver) return;
    
    let caught = false;
    for (let i = itemsInSea.length - 1; i >= 0; i--) {
        const item = itemsInSea[i];
        const dist = raftGroup.position.distanceTo(item.position);

        if (dist < 9) { // Hook reach radius
            // Collect Resource
            const type = item.userData.type;
            if (type === 'wood') state.wood += 2;
            if (type === 'food') state.food += 1;
            if (type === 'water') state.water += 1;
            if (type === 'scrap') state.scrap += 1;

            state.totalCollected++;
            sfx.playCollect();
            showFloatingText(`+1 ${getItemName(type)}`, item.position);

            scene.remove(item);
            itemsInSea.splice(i, 1);
            caught = true;
            break;
        }
    }

    if (!caught) {
        showToast("لا توجد موارد قريبة من الخطاف!");
    }
    updateUI();
}

function getItemName(type) {
    if (type === 'wood') return 'خشب';
    if (type === 'food') return 'طعام';
    if (type === 'water') return 'ماء';
    return 'خردة';
}

function eatFood() {
    if (state.food > 0 && state.hunger < 100) {
        state.food--;
        state.hunger = Math.min(100, state.hunger + 30);
        sfx.playEat();
        showToast("قم بتبديل طاقتك بالطعام (+30 جوع)");
        updateUI();
    } else if (state.food <= 0) {
        showToast("ليس لديك طعام!");
    }
}

function drinkWater() {
    if (state.water > 0 && state.thirst < 100) {
        state.water--;
        state.thirst = Math.min(100, state.thirst + 35);
        sfx.playDrink();
        showToast("ارتويت بالماء النقي (+35 عطش)");
        updateUI();
    } else if (state.water <= 0) {
        showToast("ليس لديك ماء!");
    }
}

function repairRaft() {
    if (state.wood >= 2 && state.scrap >= 1 && state.raftDurability < 100) {
        state.wood -= 2;
        state.scrap -= 1;
        state.raftDurability = Math.min(100, state.raftDurability + 25);
        sfx.playRepair();
        showToast("تم إصلاح وتدعيم القارب (+25% صلابة)");
        updateUI();
    } else if (state.raftDurability >= 100) {
        showToast("القارب في حالة ممتازة بالفعل!");
    } else {
        showToast("يلزمك: 2 خشب و 1 خردة للإصلاح!");
    }
}

// Notification Toast
function showToast(msg) {
    const toast = document.getElementById('warning-toast');
    document.getElementById('warning-msg').innerText = msg;
    toast.classList.remove('opacity-0');
    toast.classList.add('opacity-100');
    setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
    }, 2500);
}

// 3D Floating Score Text
function showFloatingText(text, pos3D) {
    const el = document.createElement('div');
    el.className = 'floating-text text-amber-300 text-lg';
    el.innerText = text;

    // Convert 3D position to Screen Coordinates
    const vector = pos3D.clone();
    vector.project(camera);
    const x = (vector.x * .5 + .5) * window.innerWidth;
    const y = (-(vector.y * .5) + .5) * window.innerHeight;

    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
    document.body.appendChild(el);

    setTimeout(() => el.remove(), 1200);
}

// Update UI Numbers & Progress Bars
function updateUI() {
    document.getElementById('inv-wood').innerText = state.wood;
    document.getElementById('inv-food').innerText = state.food;
    document.getElementById('inv-water').innerText = state.water;
    document.getElementById('inv-scrap').innerText = state.scrap;

    document.getElementById('val-health').innerText = `${Math.round(state.health)}%`;
    document.getElementById('bar-health').style.width = `${state.health}%`;

    document.getElementById('val-hunger').innerText = `${Math.round(state.hunger)}%`;
    document.getElementById('bar-hunger').style.width = `${state.hunger}%`;

    document.getElementById('val-thirst').innerText = `${Math.round(state.thirst)}%`;
    document.getElementById('bar-thirst').style.width = `${state.thirst}%`;

    document.getElementById('val-raft').innerText = `${Math.round(state.raftDurability)}%`;
    document.getElementById('bar-raft').style.width = `${state.raftDurability}%`;
}

// Main Game Loop & Physics Update
let sharkAngle = 0;
let lastSharkAttack = 0;

function animate() {
    requestAnimationFrame(animate);

    if (state.gameOver) return;

    const time = clock.getElapsedTime();

    // 1. Ocean Wave Animation & Vertex Deformation
    const pos = oceanMesh.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        const u = pos.getX(i);
        const v = pos.getZ(i);
        pos.setY(i, getWaveHeight(u, v, time));
    }
    pos.needsUpdate = true;

    // 2. Raft Movement & Water Physics Floating
    const raftX = raftGroup.position.x;
    const raftZ = raftGroup.position.z;

    // Steering Controls
    const speed = 0.08;
    raftGroup.position.x += move.right * speed;
    raftGroup.position.z -= move.forward * speed;

    // Bobbing and Tilting with Waves
    const waveH = getWaveHeight(raftX, raftZ, time);
    raftGroup.position.y = waveH + 0.2;
    raftGroup.rotation.z = Math.sin(time * 1.5) * 0.05;
    raftGroup.rotation.x = Math.cos(time * 1.2) * 0.05;

    // Smooth Third-Person Camera Follow
    camera.position.x = THREE.MathUtils.lerp(camera.position.x, raftGroup.position.x, 0.05);
    camera.position.z = THREE.MathUtils.lerp(camera.position.z, raftGroup.position.z + 14, 0.05);
    camera.lookAt(raftGroup.position.x, raftGroup.position.y + 1, raftGroup.position.z);

    // 3. Floating Items Logic & Drift
    itemsInSea.forEach((item, idx) => {
        // Drift items towards raft gradually
        const dir = new THREE.Vector3().subVectors(raftGroup.position, item.position).normalize();
        item.position.x += dir.x * item.userData.driftSpeed;
        item.position.z += dir.z * item.userData.driftSpeed;

        // Item Float on Waves
        item.position.y = getWaveHeight(item.position.x, item.position.z, time) + 0.3;
        item.rotation.y += 0.01;
    });

    // 4. Shark AI Swimming & Attack Logic
    sharkAngle += 0.015;
    const sharkDist = 12 + Math.sin(time) * 4;
    sharkGroup.position.x = raftGroup.position.x + Math.cos(sharkAngle) * sharkDist;
    sharkGroup.position.z = raftGroup.position.z + Math.sin(sharkAngle) * sharkDist;
    sharkGroup.position.y = getWaveHeight(sharkGroup.position.x, sharkGroup.position.z, time);
    sharkGroup.rotation.y = -sharkAngle + Math.PI / 2;

    // Periodic Shark Attack
    if (time - lastSharkAttack > 18) {
        lastSharkAttack = time;
        sfx.playSharkAttack();
        showToast("⚠️ أقرش يحاول تدمير أخشاب القارب!");
        state.raftDurability = Math.max(0, state.raftDurability - 20);
        updateUI();

        if (state.raftDurability <= 0) {
            triggerGameOver("دمر القرش قاربك وسقطت في الأعماق!");
        }
    }

    // 5. Day / Night Cycle Simulation
    state.dayTime = (time * 0.02) % 1;
    const sunAngle = state.dayTime * Math.PI * 2;
    sunLight.position.x = Math.cos(sunAngle) * 60;
    sunLight.position.y = Math.sin(sunAngle) * 60;

    const dayIndicator = document.getElementById('day-night-indicator');
    if (sunLight.position.y > 0) {
        scene.background.setHSL(0.6, 0.5, 0.2);
        scene.fog.color.setHSL(0.6, 0.5, 0.2);
        dayIndicator.innerHTML = '<i class="fa-solid fa-sun ml-1 text-amber-400"></i> النهار';
    } else {
        scene.background.setHSL(0.6, 0.8, 0.03);
        scene.fog.color.setHSL(0.6, 0.8, 0.03);
        dayIndicator.innerHTML = '<i class="fa-solid fa-moon ml-1 text-indigo-300"></i> الليل';
    }

    // Render 3D Scene
    renderer.render(scene, camera);
}

// Survival Decay Timers (Hunger, Thirst, Survival Time)
setInterval(() => {
    if (state.gameOver) return;

    state.timeSurvived++;
    state.hunger = Math.max(0, state.hunger - 0.8);
    state.thirst = Math.max(0, state.thirst - 1.2);

    // Starvation / Dehydration Penalty
    if (state.hunger <= 0 || state.thirst <= 0) {
        state.health = Math.max(0, state.health - 4);
        sfx.playSharkAttack();
    }

    if (state.health <= 0) {
        triggerGameOver(state.hunger <= 0 ? "مت بسبب الموت جوعاً!" : "مت بسبب الجفاف العديد!");
    }

    updateUI();
}, 1000);

// Spawners Interval
setInterval(spawnSeaItem, 3500);

// Window Resize
function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function triggerGameOver(reason) {
    state.gameOver = true;
    document.getElementById('death-cause').innerText = reason;
    
    const mins = Math.floor(state.timeSurvived / 60).toString().padStart(2, '0');
    const secs = (state.timeSurvived % 60).toString().padStart(2, '0');
    document.getElementById('stat-survival-time').innerText = `${mins}:${secs}`;
    document.getElementById('stat-collected').innerText = state.totalCollected;

    document.getElementById('game-over-modal').classList.remove('hidden');
    document.getElementById('game-over-modal').classList.add('flex');
}

function restartGame() {
    state.health = 100;
    state.hunger = 100;
    state.thirst = 100;
    state.raftDurability = 100;
    state.wood = 5;
    state.food = 3;
    state.water = 3;
    state.scrap = 2;
    state.timeSurvived = 0;
    state.totalCollected = 0;
    state.gameOver = false;

    // Clear Sea Items
    itemsInSea.forEach(item => scene.remove(item));
    itemsInSea = [];

    raftGroup.position.set(0, 0, 0);

    document.getElementById('game-over-modal').classList.add('hidden');
    document.getElementById('game-over-modal').classList.remove('flex');

    updateUI();
}

// Start Game Engine on Window Load
window.onload = () => {
    initEngine();
    setupInputs();
    updateUI();
    animate();
};
</script>
