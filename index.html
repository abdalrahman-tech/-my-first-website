<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة البقاء في المحيط - Ocean Survival Canvas Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1d3a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #1a3c40, #071e22);
        }
        /* UI Overlay */
        .ui-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(10, 25, 47, 0.85);
            border: 2px solid #00adb5;
            border-radius: 12px;
            padding: 12px 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            min-width: 220px;
            pointer-events: none;
        }
        .stat-bar {
            margin-bottom: 8px;
        }
        .stat-bar:last-child {
            margin-bottom: 0;
        }
        .stat-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 3px;
            color: #e3e3e3;
        }
        .bar-outer {
            width: 100%;
            height: 10px;
            background: #222831;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #393e46;
        }
        .bar-inner {
            height: 100%;
            width: 100%;
            transition: width 0.2s ease;
        }
        #health-bar { background: linear-gradient(90deg, #ff4b4b, #ff6b6b); }
        #hunger-bar { background: linear-gradient(90deg, #f0a500, #ffc93c); }
        #thirst-bar { background: linear-gradient(90deg, #00adb5, #00fff5); }

        .inventory-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(10, 25, 47, 0.85);
            border: 2px solid #00adb5;
            border-radius: 12px;
            padding: 10px 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            pointer-events: none;
            display: flex;
            gap: 12px;
            font-size: 14px;
        }
        .inv-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Controls */
        .controls-container {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            pointer-events: none;
        }
        .touch-btn {
            pointer-events: auto;
            background: radial-gradient(circle, rgba(0, 173, 181, 0.8) 0%, rgba(15, 76, 92, 0.9) 100%);
            border: 2px solid #00fff5;
            border-radius: 50%;
            color: #fff;
            width: 65px;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(0, 255, 245, 0.3);
            cursor: pointer;
            touch-action: manipulation;
        }
        .touch-btn:active {
            transform: scale(0.92);
            background: #00fff5;
            color: #000;
        }
        .action-btns {
            display: flex;
            gap: 12px;
        }
        .action-btn {
            border-radius: 12px;
            width: auto;
            padding: 0 20px;
            height: 55px;
            font-size: 15px;
            background: linear-gradient(135deg, #ff5722, #e64a19);
            border-color: #ff8a65;
        }

        /* Game Over Modal */
        #game-over-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #game-over-modal h1 {
            color: #ff4b4b;
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 75, 75, 0.5);
        }
        #restart-btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            background: #00adb5;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 173, 181, 0.5);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Stats Panel -->
    <div class="ui-panel">
        <div class="stat-bar">
            <div class="stat-label"><span>الصحة</span><span id="health-val">100%</span></div>
            <div class="bar-outer"><div id="health-bar" class="bar-inner"></div></div>
        </div>
        <div class="stat-bar">
            <div class="stat-label"><span>الجوع</span><span id="hunger-val">100%</span></div>
            <div class="bar-outer"><div id="hunger-bar" class="bar-inner"></div></div>
        </div>
        <div class="stat-bar">
            <div class="stat-label"><span>العطش</span><span id="thirst-val">100%</span></div>
            <div class="bar-outer"><div id="thirst-bar" class="bar-inner"></div></div>
        </div>
    </div>

    <!-- Inventory Panel -->
    <div class="inventory-panel">
        <div class="inv-item">🪵 <span id="wood-cnt">0</span></div>
        <div class="inv-item">🥩 <span id="food-cnt">2</span></div>
        <div class="inv-item">💧 <span id="water-cnt">2</span></div>
        <div class="inv-item">⏱️ <span id="time-cnt">0s</span></div>
    </div>

    <!-- Controls -->
    <div class="controls-container">
        <div style="display: flex; gap: 10px;">
            <div class="touch-btn" id="btn-left">◄</div>
            <div class="touch-btn" id="btn-right">►</div>
        </div>
        <div class="action-btns">
            <div class="touch-btn action-btn" id="btn-eat">أكل 🥩</div>
            <div class="touch-btn action-btn" id="btn-drink" style="background: linear-gradient(135deg, #0288d1, #01579b); border-color: #4fc3f7;">شرب 💧</div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-modal">
        <h1>انتهت اللعبة!</h1>
        <p id="death-reason" style="color: #ccc; font-size: 18px;"></p>
        <p style="margin-top: 10px; font-size: 16px;">الصمود: <span id="final-time">0</span> ثانية</p>
        <button id="restart-btn" onclick="resetGame()">إعادة المحاولة</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Canvas Resize
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Audio Synthesizer (Web Audio API - Standalone)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'collect') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'eat') {
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'hurt') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // Game State
    let gameOver = false;
    let timeSurvived = 0;
    let timerInterval = null;

    const player = {
        x: canvas.width / 2,
        y: canvas.height * 0.65,
        width: 90,
        height: 45,
        speed: 6,
        dx: 0,
        health: 100,
        hunger: 100,
        thirst: 100,
        wood: 0,
        food: 2,
        water: 2
    };

    let items = [];
    let sharks = [];
    let waves = [];

    // Wave Background Particles
    for (let i = 0; i < 25; i++) {
        waves.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            length: Math.random() * 80 + 40,
            speed: Math.random() * 1.5 + 0.5
        });
    }

    // Controls Handling
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    // Touch Buttons
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const btnEat = document.getElementById('btn-eat');
    const btnDrink = document.getElementById('btn-drink');

    const setupTouch = (elem, onStart, onEnd) => {
        elem.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(); });
        elem.addEventListener('touchend', (e) => { e.preventDefault(); onEnd(); });
        elem.addEventListener('mousedown', onStart);
        elem.addEventListener('mouseup', onEnd);
    };

    setupTouch(btnLeft, () => player.dx = -player.speed, () => player.dx = 0);
    setupTouch(btnRight, () => player.dx = player.speed, () => player.dx = 0);
    
    btnEat.addEventListener('click', eatFood);
    btnEat.addEventListener('touchstart', (e) => { e.preventDefault(); eatFood(); });
    
    btnDrink.addEventListener('click', drinkWater);
    btnDrink.addEventListener('touchstart', (e) => { e.preventDefault(); drinkWater(); });

    function eatFood() {
        if (player.food > 0 && player.hunger < 100) {
            player.food--;
            player.hunger = Math.min(100, player.hunger + 30);
            playSound('eat');
            updateUI();
        }
    }

    function drinkWater() {
        if (player.water > 0 && player.thirst < 100) {
            player.water--;
            player.thirst = Math.min(100, player.thirst + 35);
            playSound('eat');
            updateUI();
        }
    }

    // Spawners
    function spawnItem() {
        if (gameOver) return;
        const types = ['wood', 'food', 'water'];
        const type = types[Math.floor(Math.random() * types.length)];
        items.push({
            x: Math.random() * (canvas.width - 40) + 20,
            y: -30,
            type: type,
            size: 25,
            speed: Math.random() * 1.5 + 1.5
        });
    }

    function spawnShark() {
        if (gameOver) return;
        sharks.push({
            x: Math.random() < 0.5 ? -60 : canvas.width + 60,
            y: canvas.height * 0.65 + (Math.random() * 60 - 30),
            speed: (Math.random() * 2 + 2) * (Math.random() < 0.5 ? 1 : -1),
            size: 40
        });
    }

    setInterval(spawnItem, 2000);
    setInterval(spawnShark, 6000);

    // Survival Decay Timer
    function startTimers() {
        timerInterval = setInterval(() => {
            if (gameOver) return;
            timeSurvived++;
            player.hunger = Math.max(0, player.hunger - 1.5);
            player.thirst = Math.max(0, player.thirst - 2.5);

            if (player.hunger === 0 || player.thirst === 0) {
                player.health = Math.max(0, player.health - 5);
                playSound('hurt');
            }

            if (player.health <= 0) {
                endGame(player.hunger === 0 ? "مت بسبب الجوع!" : (player.thirst === 0 ? "مت بسبب العطش!" : "لقد تم القضاء عليك!"));
            }

            updateUI();
        }, 1000);
    }

    function updateUI() {
        document.getElementById('health-bar').style.width = player.health + '%';
        document.getElementById('health-val').innerText = Math.round(player.health) + '%';
        
        document.getElementById('hunger-bar').style.width = player.hunger + '%';
        document.getElementById('hunger-val').innerText = Math.round(player.hunger) + '%';
        
        document.getElementById('thirst-bar').style.width = player.thirst + '%';
        document.getElementById('thirst-val').innerText = Math.round(player.thirst) + '%';

        document.getElementById('wood-cnt').innerText = player.wood;
        document.getElementById('food-cnt').innerText = player.food;
        document.getElementById('water-cnt').innerText = player.water;
        document.getElementById('time-cnt').innerText = timeSurvived + 's';
    }

    // Main Game Loop
    let waveOffset = 0;
    function loop() {
        if (!gameOver) {
            update();
            render();
            requestAnimationFrame(loop);
        }
    }

    function update() {
        // Keyboard Controls
        if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
        if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;

        // Touch Control Movement
        player.x += player.dx;

        // Boundaries
        player.x = Math.max(player.width / 2, Math.min(canvas.width - player.width / 2, player.x));

        // Update Waves
        waveOffset += 0.05;
        waves.forEach(w => {
            w.x -= w.speed;
            if (w.x + w.length < 0) w.x = canvas.width;
        });

        // Items Logic
        for (let i = items.length - 1; i >= 0; i--) {
            let it = items[i];
            it.y += it.speed;

            // Collision with Raft
            let dist = Math.hypot(it.x - player.x, it.y - player.y);
            if (dist < player.width / 2 + it.size) {
                if (it.type === 'wood') player.wood++;
                if (it.type === 'food') player.food++;
                if (it.type === 'water') player.water++;
                playSound('collect');
                items.splice(i, 1);
                updateUI();
                continue;
            }

            // Remove out of bounds
            if (it.y > canvas.height) items.splice(i, 1);
        }

        // Sharks Logic
        for (let i = sharks.length - 1; i >= 0; i--) {
            let s = sharks[i];
            s.x += s.speed;

            // Collision with Raft
            let dist = Math.hypot(s.x - player.x, s.y - player.y);
            if (dist < player.width / 2 + s.size / 2) {
                player.health = Math.max(0, player.health - 25);
                playSound('hurt');
                sharks.splice(i, 1);
                updateUI();
                if (player.health <= 0) endGame("هاجمك ألك القرش القاتل!");
                continue;
            }

            // Remove out of bounds
            if (s.x < -100 || s.x > canvas.width + 100) sharks.splice(i, 1);
        }
    }

    function render() {
        // Clear Sky & Ocean
        ctx.fillStyle = '#0b1d3a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Water Gradient
        let oceanGrad = ctx.createLinearGradient(0, canvas.height * 0.4, 0, canvas.height);
        oceanGrad.addColorStop(0, '#005c53');
        oceanGrad.addColorStop(0.5, '#042940');
        oceanGrad.addColorStop(1, '#001c30');
        ctx.fillStyle = oceanGrad;
        ctx.fillRect(0, canvas.height * 0.4, canvas.width, canvas.height * 0.6);

        // Dynamic Wave Lines
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 2;
        waves.forEach(w => {
            ctx.beginPath();
            ctx.moveTo(w.x, w.y);
            ctx.lineTo(w.x + w.length, w.y + Math.sin(waveOffset + w.x) * 5);
            ctx.stroke();
        });

        // Draw Raft
        ctx.save();
        ctx.translate(player.x, player.y + Math.sin(waveOffset * 2) * 4);
        
        // Raft Wooden Planks
        ctx.fillStyle = '#8d5524';
        ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
        ctx.strokeStyle = '#5c3a21';
        ctx.lineWidth = 3;
        ctx.strokeRect(-player.width / 2, -player.height / 2, player.width, player.height);

        // Raft details (Logs separation)
        ctx.beginPath();
        ctx.moveTo(-player.width / 2, 0); ctx.lineTo(player.width / 2, 0);
        ctx.moveTo(-player.width / 2, -player.height / 4); ctx.lineTo(player.width / 2, -player.height / 4);
        ctx.moveTo(-player.width / 2, player.height / 4); ctx.lineTo(player.width / 2, player.height / 4);
        ctx.stroke();

        // Player Stick Figure / Survivor
        ctx.fillStyle = '#ffdbac';
        ctx.beginPath(); // Head
        ctx.arc(0, -15, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#e0a96d';
        ctx.lineWidth = 4;
        ctx.beginPath(); // Body
        ctx.moveTo(0, -7); ctx.lineTo(0, 10);
        ctx.stroke();

        ctx.restore();

        // Draw Floating Items
        items.forEach(it => {
            ctx.save();
            ctx.translate(it.x, it.y + Math.sin(waveOffset * 3 + it.x) * 3);
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            let icon = '🪵';
            if (it.type === 'food') icon = '🥩';
            if (it.type === 'water') icon = '💧';

            ctx.fillText(icon, 0, 0);
            ctx.restore();
        });

        // Draw Sharks
        sharks.forEach(s => {
            ctx.save();
            ctx.translate(s.x, s.y);
            ctx.fillStyle = '#4a5568';

            // Fin Drawing
            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(15, 15);
            ctx.lineTo(-15, 15);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        });
    }

    function endGame(reason) {
        gameOver = true;
        clearInterval(timerInterval);
        document.getElementById('death-reason').innerText = reason;
        document.getElementById('final-time').innerText = timeSurvived;
        document.getElementById('game-over-modal').style.display = 'flex';
    }

    function resetGame() {
        gameOver = false;
        timeSurvived = 0;
        player.health = 100;
        player.hunger = 100;
        player.thirst = 100;
        player.wood = 0;
        player.food = 2;
        player.water = 2;
        player.x = canvas.width / 2;
        items = [];
        sharks = [];
        document.getElementById('game-over-modal').style.display = 'none';
        updateUI();
        startTimers();
        loop();
    }

    // Start Game
    updateUI();
    startTimers();
    loop();
</script>
</body>
</html>
