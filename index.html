            }

### مميزات اللعبة:
* **بناء الموارد:** بناء مصانع الذهب والحديد لجمع الموارد تلقائياً.
* **الأبراج الدفاعية:** بناء مدفعية، أبراج صواريخ، وأبراج ثلج لتبطئ الأعداء.
* **موجات أعداء متدرجة:** هجوم موجات من الدبابات والجنود بتزيد صعوبتها مع كل موجة.
* **تحكم كامل:** أزرار لتطوير القاعدة، بيع الأبراج، وبدء الموجات بنفسك.
